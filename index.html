{id:'p3',title:'The Science of Forgetting',minutes:20,paras:[
`Why do we forget so much of what we learn? For a long time, forgetting was seen simply as a failure of memory – a sign of a weak mind or poor concentration. Today, however, many psychologists argue that forgetting is not only normal but, in some ways, useful. Understanding how and why it happens can help learners organise their study far more effectively.`,
`The first systematic study of forgetting was carried out by the German psychologist Hermann Ebbinghaus in the 1880s. Using himself as the only subject, Ebbinghaus memorised long lists of meaningless syllables, such as DAX or BOK, and then tested how many he could remember after different periods of time. His results, published in 1885, showed that memory declines very rapidly at first and then more slowly. Much of what he had learned was lost within the first day, but the small amount that remained after a week tended to stay for much longer. This pattern, now called the forgetting curve, has been confirmed in many later studies, although the exact rate of forgetting depends on how meaningful the material is and how well it was learned in the first place.`,
`Ebbinghaus also made a second, more encouraging discovery. When he relearned a list he had partly forgotten, it took him less time than learning it from the beginning, and after each review the information was forgotten more slowly. In other words, reviewing material at intervals strengthens memory. This principle, known as spaced repetition, is the basis of many modern learning apps, which show learners a word again just before they are likely to forget it. Research suggests that the same amount of study time produces better long-term results when it is spread out over several days than when it is concentrated into a single session – a finding that should worry any student who plans to revise everything the night before an exam.`,
`A related idea is the testing effect. In a well-known experiment published in 2006, the psychologists Henry Roediger and Jeffrey Karpicke asked students to learn short prose passages. Some students read the passages several times, while others read them once and then tried to recall as much as they could without looking. When the students were tested a few minutes later, those who had simply reread the material performed slightly better. One week later, however, the pattern was reversed: the students who had practised recalling the information remembered considerably more. The act of retrieving a memory, it seems, makes that memory easier to find in the future.`,
`Many learners are surprised by these results because rereading feels productive. When we read a familiar text, the words seem easy to process, and this fluency gives us the impression that we have mastered the content. Psychologists call this an illusion of knowing. Recalling information without help feels more difficult, and learners often make mistakes, but this effort is precisely what makes the learning last. The psychologist Robert Bjork has described such challenges as desirable difficulties.`,
`Sleep also plays an important role. During sleep, the brain appears to replay and reorganise information acquired during the day, transferring some of it into more stable long-term storage. Several studies have found that people who sleep after learning remember more than those who stay awake for the same period. Lack of sleep, by contrast, makes it harder both to form new memories and to concentrate.`,
`Finally, it is worth remembering that forgetting has a purpose. If we remembered every detail of every day, our minds would be cluttered with useless information, and it would be harder to find what we really need. By allowing unused memories to fade, the brain keeps the most relevant knowledge accessible. For language learners, the lesson is clear: forgetting is inevitable, but with regular, spaced practice and frequent self-testing, the words and structures that matter most can be made to last.`],

{id:'l2',part:2,title:'Welcome to Green Valley Eco Park',ctx:'A guide is giving a talk to visitors at an eco park.',voices:{G:'f'},
 script:[
 ['G',"Good morning, everyone, and welcome to Green Valley Eco Park. My name's Sarah, and I'll be giving you a short introduction before you set off to explore."],
 ['G',"Let me start with a little history. It might be hard to believe now, when you look at all these trees, but twenty years ago this whole valley was a stone quarry. Many people assume it was once a tea estate, because there are estates on the hills nearby, but in fact the land was used to extract granite for road building. When the quarry closed, a local charity bought the site and began turning it into the park you see today."],
 ['G',"We're very proud that the park is run as sustainably as possible. There's a small turbine in the stream that provides some of our electricity, and we have a wind turbine on the ridge, although that's only for demonstration. Most of the power for the visitor centre actually comes from the solar panels on its roof, which also heat the water in our café."],
 ['G',"Now, a few rules. You're welcome to take as many photographs as you like. In fact, we run a photo competition every month. You can walk on all the marked paths until the park closes at six. The one thing we really ask is that you don't feed the birds. Bread is bad for them, and it attracts rats."],
 ['G',"Some of you have asked about our night walk, where you can see bats and frogs. We used to run it every evening, but because of staff shortages it now only takes place on Fridays. It starts at seven, and you do need to book."],
 ['G',"Families, please note that children under twelve must stay with an adult on the lake trail, as some of the banks are steep. Children don't need to wear helmets except for climbing, and there's no need to book most activities in advance."],
 ['G',"Right, let me tell you where things are. If you're interested in bird watching, the best place is the lake. There's a hide on the eastern shore where you can sit quietly. The forest is where you'll find our tree planting project. Every visitor is invited to plant a young tree, and we'll give you a certificate with its location."],
 ['G',"For the more adventurous, rock climbing takes place on the old quarry wall, with qualified instructors, and that's where you'll need a helmet. If it's raining, why not join our craft workshop? It's held in the visitor centre, right next to the café, and today the children are making bird boxes."],
 ['G',"And finally, if you've brought lunch, the picnic tables are beside the butterfly house, which is a lovely sunny spot. Please don't use the car park for picnics, as it's too busy. Enjoy your visit, and if you have any questions, the staff in green T-shirts will be happy to help."]],

{id:'l3',part:3,title:'A project on rooftop gardens',ctx:'Two students, Maya and Tom, are discussing their project with their tutor, Dr Lewis.',voices:{T:'m',Maya:'f',Tom:'m2'},
 script:[
 ['T',"Come in, Maya, Tom. So, you wanted to talk about your project on rooftop gardens. Remind me why you chose this topic."],
 ['Maya','Well, Tom originally wanted to look at electric buses.'],
 ['Tom','Which we rejected because there was already so much research on them.'],
 ['Maya',"Exactly. But the real reason was that I visited Singapore last year and saw a huge garden on top of a hospital. It was full of people, and I wondered whether the same idea could work here."],
 ['T','Good. And how did the data collection go?'],
 ['Tom',"Mixed. We designed a questionnaire for residents of three buildings that have rooftop gardens. The questions were fine, I think. We tested them on friends first, and analysing the results was quick. The trouble was that we only got twenty-three responses out of about two hundred."],
 ['T',"That's quite a low response rate. I wouldn't throw the survey away, but you need another source. Have you thought about talking to the people who own or run the buildings?"],
 ['Maya','Interviewing them, you mean?'],
 ['T',"Yes. Even three or four interviews would give you a much richer picture. Repeating the survey online rarely helps."],
 ['T','What about your findings so far? Anything unexpected?'],
 ['Maya','We assumed people would mainly talk about lower energy bills, because a garden insulates the roof.'],
 ['Tom','And some did mention that, but only a few.'],
 ['Maya',"What really surprised us was how many said the main benefit was meeting their neighbours. The garden had become a kind of community space."],
 ['Tom',"Yes, the social side came up again and again. We were also surprised that very few gardens grew vegetables. Most are just plants and seating."],
 ['T',"Interesting. Now, I've read your draft conclusion. It's a reasonable length, and it doesn't simply repeat your introduction, which is good. But you've added a new point about government grants that isn't discussed anywhere else in the report. A conclusion shouldn't introduce new information."],
 ['Maya','Ah, we can move that into the discussion section.'],
 ['T',"Good idea. So, let's agree on your next steps. First, the reader has no idea where these buildings are. I'd like to see a map showing the location of each garden."],
 ['Tom','We could make one quite easily.'],
 ['T',"Second, the literature review. It's far too long at the moment. I'd say you need to cut it by about a third."],
 ['Maya','A third? OK.'],
 ['T',"Third, you talk a lot about benefits, but nothing about the cost of maintaining a garden: the watering, the gardeners, repairs to the roof. Please include that."],
 ['Tom','Right. And what about the photos we took?'],
 ['T',"Before you use them, you must ask the building manager for permission. Not the residents. The manager is responsible for the property."],
 ['Maya',"We'll email them today."],
 ['T',"And finally, the deadline. The department wants final reports by Monday the fifth, but I need to check them first, so please submit yours to me by Friday."],
 ['Tom','This Friday?'],
 ['T','No, next Friday. That gives you ten days.'],
 ['Maya','That\'s fine. Thank you, Dr Lewis.']],

{id:'l4',part:4,title:'Lecture: the waggle dance of honeybees',ctx:'A lecturer is giving a talk about how honeybees communicate.',voices:{L:'m'},
 script:[
 ['L',"Good afternoon. Today I'm going to talk about one of the most remarkable forms of communication in the animal world: the waggle dance of the honeybee."],
 ['L',"For centuries, beekeepers noticed that when one bee found a good source of nectar, many others from the same colony soon arrived at the same flowers. How did they know where to go? The answer was provided by the Austrian scientist Karl von Frisch, who spent decades observing bees in glass-walled hives. His work was eventually recognised with a Nobel Prize, which he shared with two other researchers in 1973."],
 ['L',"So what is the waggle dance? When a forager bee returns from a rich food source, she performs a dance on the vertical surface of the honeycomb, inside the hive, where it's completely dark. The bee runs forward in a straight line while vibrating her body from side to side. This is the waggle run. Then she circles back to the start and repeats the movement."],
 ['L',"The remarkable thing is that the dance contains a kind of map. The angle of the waggle run, measured from the vertical, represents the angle between the food source and the sun. So if the bee waggles straight upwards, the food is in the same direction as the sun."],
 ['L',"Distance, on the other hand, is shown by the duration of the waggle run. The longer the bee waggles, the further away the food is. For food that's very close to the hive, bees were traditionally thought to perform a different movement, a simple circling motion that von Frisch called the round dance, although many researchers now see this as a short version of the waggle dance."],
 ['L',"Of course, direction and distance alone aren't enough. The other bees, who follow the dancer closely in the dark, also pick up the scent of the flowers on her body, which helps them recognise the right plants when they arrive."],
 ['L',"Now, you may be wondering about a problem. The sun moves across the sky during the day, so if a bee dances an hour after visiting the flowers, the angle would be wrong. Amazingly, bees compensate for this. They have an internal clock which allows them to adjust the angle according to the time of day."],
 ['L',"But how do bees actually measure distance? For many years, it was assumed that they measured the energy they used in flight. Then, in experiments around the year 2000, researchers trained bees to fly through a narrow tunnel whose walls were covered with a pattern of stripes. The bees danced as if they had flown much further than they really had. This showed that bees estimate distance from the amount of visual movement they see as the landscape passes by."],
 ['L',"Researchers have even built robot bees to test the theory. These small machines, placed in a hive, were programmed to imitate the dance, and some real bees did follow the robot's instructions and fly in the direction it indicated, although less reliably than when following a real bee."],
 ['L',"Finally, why does this matter? Interestingly, studies suggest that the dance does not always help a colony. When flowers are everywhere, bees can find food on their own. But when good food sources are scarce and widely scattered, the information in the dance allows the colony to collect food much more efficiently. That brings me to the end of today's lecture."]],
 groups:[{type:'gap',instr:'Complete the notes. Write ONE WORD AND/OR A NUMBER for each answer.',heading:'The waggle dance',items:[
  {q:'Karl von Frisch shared a Nobel Prize in ___.',a:['1973']},
  {q:'The dance is performed inside the dark ___.',a:['hive']},
  {q:'The angle of the waggle run shows direction relative to the ___.',a:['sun']},
  {q:'The ___ of the waggle run shows distance.',a:['duration','length']},
  {q:'For food very close to the hive: the ___ dance.',a:['round']},
  {q:'Followers detect the ___ of the flowers on the dancer.',a:['scent','smell']},
  {q:'Bees adjust for the sun\'s movement with an internal ___.',a:['clock']},
  {q:'Bees flew through a narrow ___ with striped walls.',a:['tunnel']},
  {q:'Robot bees were programmed to ___ the dance.',a:['imitate','mimic','copy']},
  {q:'The dance helps most when good food sources are ___.',a:['scarce','rare']}]}]}

function mutate(w){const m=w.match(/([a-z])\1/);if(m)return w.replace(m[0],m[1]);for(let i=Math.floor(w.length/2);i<w.length-1;i++){if(!/[aeiou]/i.test(w[i]))return w.slice(0,i+1)+w[i]+w.slice(i+1);}return w+'e';}

SPELL.forEach(sp=>{
 reg({kind:'spell',id:'sp-'+sp.w,unit:sp.s==='A'?'spellA':'spellB',sp});
 let o=[sp.w,sp.x,mutate(sp.w)].filter((v,i,a)=>a.indexOf(v)===i);if(o.length<3)o.push(sp.w.slice(0,-1)+sp.w.slice(-1)+sp.w.slice(-1));
 reg({kind:'mcq',id:'sm-'+sp.w,unit:sp.s==='A'?'spellA':'spellB',q:'Which spelling is correct? ('+sp.d+')',o,a:0,why:'You wrote "'+sp.x+'" in a chat. Correct: '+sp.w+' — '+sp.si});
});

const all = k => Object.values(ITEMS).filter(i=>i.kind===k&&i.unit!=='place'&&!i.vocab&&!i.ctx&&i.unit!=='irreg');

function placeLevel(res){
 const band=b=>{const r=res.filter(x=>ITEMS[x.id]&&ITEMS[x.id].band===b);return r.length?r.filter(x=>x.ok).length/r.length*100:0;};
 const a=band('A2'),b=band('B1'),c=band('B2');
 if(c>=70&&b>=70)return 'B2';
 if(b>=60&&a>=60)return c>=40?'B1+':'B1';
 if(a>=60)return b>=40?'A2+':'A2';
 return 'A1–A2';}

/* ---- vocabulary (spaced repetition) ---- */
const INT=[0,1,2,4,7,15];
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return dkey(d);}
const WID = w => 'w-'+w.toLowerCase().replace(/[^a-z0-9]+/g,'-');
const BANK = VOCAB.flatMap(t=>t.words.map(a=>({id:WID(a[0]),w:a[0],d:a[1],si:a[2],ex:a[3],topic:t.id,pos:a[4]||'',f:a[5]||''})));
function allWords(){return BANK.concat((S.myWords||[]).map(w=>Object.assign({topic:'mine'},w)));}
function wordById(id){return allWords().find(w=>w.id===id);}
function today(){return dkey(new Date());}
function dueList(){const t=today();return allWords().filter(w=>{const s=S.vocab[w.id];return s&&s.due<=t;});}
function isDaily(w){return !!(VOCAB.find(t=>t.id===w.topic)||{}).daily;}
function newList(n,topic){const f=S.vfocus||'mix';
 if(topic)return topicWords(topic).filter(w=>!S.vocab[w.id]).slice(0,n);
 if(f==='ielts')return ieltsNewList(n);
 const aw=allWords().filter(w=>!S.vocab[w.id]&&!isIelts(w)&&(w.topic==='mine'||f==='mix'||(f==='daily')===isDaily(w)));
 const out=aw.filter(w=>w.topic==='mine'),groups={};aw.filter(w=>w.topic!=='mine').forEach(w=>(groups[w.topic]=groups[w.topic]||[]).push(w));
 const lists=Object.values(groups);let i=0;while(out.length<n&&lists.some(l=>l.length)){const l=lists[i%lists.length];if(l.length)out.push(l.shift());i++;}
 return out.slice(0,n);}
function srs(id,ok){const s=S.vocab[id]||(S.vocab[id]={b:0,due:''});if(ok){s.b=Math.min(5,(s.b||0)+1);s.due=addDays(INT[s.b]);}else{s.b=1;s.due=addDays(1);}s.n=(s.n||0)+1;}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function blankOf(w){if(!w.ex)return null;const re=new RegExp('\\b'+reEsc(w.w)+'\\b','i');return re.test(w.ex)?w.ex.replace(re,'_____'):null;}
function others(w,n,field){const pool=allWords().filter(x=>x.id!==w.id&&x[field]&&x[field]!==w[field]);const same=pool.filter(x=>x.topic===w.topic);
 const src=same.length>=n?same:pool;const out=[];shuffle(src).forEach(x=>{if(out.length<n&&!out.includes(x[field]))out.push(x[field]);});return out;}
function vItem(w,kind){
 const b=blankOf(w);const kinds=['mean','mean'];if(b)kinds.push('blankc','blankt','blankt');if(w.si)kinds.push('si');kinds.push('listen');
 const k=kind||kinds[Math.floor(Math.random()*kinds.length)];let it;
 if(k==='mean')it={kind:'mcq',q:'What does "'+w.w+'"'+(w.pos?' ('+(POSN[w.pos]||w.pos)+')':'')+' mean?',o:[w.d].concat(others(w,2,'d')),a:0,why:w.ex?'Example: '+w.ex:''};
 else if(k==='blankc')it={kind:'mcq',q:'Choose the missing word:  '+b,o:[w.w].concat(others(w,2,'w')),a:0,why:w.ex+' — '+(w.si||w.d)};
 else if(k==='blankt')it={kind:'vtype',qt:'Type the missing word',p:b,hint:w.si||w.d,ans:w.w};
 else if(k==='si')it={kind:'vtype',qt:'Type the English word',p:w.si,hint:w.d,ans:w.w};
 else it={kind:'vtype',qt:'Listen and type the word',listen:w.w,p:w.d,hint:w.si||'',ans:w.w};
 it.id='v-'+w.id+'-'+k;if(it.kind==='vtype')it.alt=altSpell(w.w);it.unit='vocab';it.vocab=w.id;it.w=w;return reg(it);}
function vchip(id){const s=S.vocab[id];if(!s)return '<span class="tag t-cap">new</span>';if(s.b>=5)return '<span class="tag" style="background:var(--okbg);color:var(--ok)">mastered</span>';if(s.b>=3)return '<span class="tag" style="background:var(--okbg);color:var(--ok)">good</span>';return '<span class="tag t-style">learning</span>';}

 const en=vs.filter(v=>/^en([-_]|$)/i.test(v.lang)),gb=en.filter(v=>/GB/i.test(v.lang)),pool=gb.concat(en.filter(v=>!/GB/i.test(v.lang)));

/* ---------- fix grading ---------- */
function norm(s){return s.replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();}
function stripEnd(s){return s.replace(/[\s.!]+$/,'');}
function words(s){return norm(s).replace(/[^\w'\s-]/g,' ').split(/\s+/).filter(Boolean);}
function lcs(a,b){const m=a.length,n=b.length,T=Array.from({length:m+1},()=>new Array(n+1).fill(0));for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)T[i][j]=a[i]===b[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);return T;}
function sim(a,b){const A=words(a).map(w=>w.toLowerCase()),B=words(b).map(w=>w.toLowerCase());if(!A.length||!B.length)return 0;return lcs(A,B)[0][0]/Math.max(A.length,B.length);}
function gradeFix(v,answers){const nv=stripEnd(norm(v));
 for(const a of answers){if(stripEnd(norm(a))===nv){
   // ending punctuation: a question must end with "?"
   return{ok:true,best:a};}}
 let best=answers[0],bs=-1;for(const a of answers){const s=sim(v,a);if(s>bs){bs=s;best=a;}}
 return{ok:false,close:bs>=.8,best};}
function diffHtml(user,ans){const A=norm(user).split(' '),B=norm(ans).split(' ');const T=lcs(A,B);let i=0,j=0,out=[];
 while(i<A.length&&j<B.length){if(A[i]===B[j]){out.push(esc(A[i]));i++;j++;}else if(T[i+1][j]>=T[i][j+1]){out.push('<span class="del">'+esc(A[i])+'</span>');i++;}else{out.push('<span class="ins">'+esc(B[j])+'</span>');j++;}}
 while(i<A.length)out.push('<span class="del">'+esc(A[i++])+'</span>');while(j<B.length)out.push('<span class="ins">'+esc(B[j++])+'</span>');return out.join(' ');}

const CHK={text:'',res:null,plan:null};
function checkText(text){
 const issues=[];
 const add=(start,end,sugg,type,msg)=>{if(issues.some(x=>start<x.end&&end>x.start))return;issues.push({start,end,orig:text.slice(start,end),sugg,type,msg});};
 // sentence starts
 const starts=new Set();{const re=/(^|[.!?]\s+|\n\s*)([A-Za-z])/g;let m;while((m=re.exec(text))){const pre=text.slice(Math.max(0,m.index-8),m.index+m[1].length);if(/\b(e\.g|i\.e|etc|vs|approx|no|Mr|Ms|Dr)\.\s+$/i.test(pre))continue;starts.add(m.index+m[1].length);}}

 // 1. phrases
 phrase(/\bsri\s+lanka\b/gi,m=>m[0]==='Sri Lanka'?null:'Sri Lanka','cap','Country names start with capitals.');
 phrase(/\bdead\s+line(s?)\b/gi,m=>'deadline'+m[1],'spell','"deadline" is one word.');
 phrase(/\bone\s+drive\b/gi,()=>'OneDrive','spell','OneDrive is one word.');
 phrase(/\bwhat'?s\s*up\s+(app|button|group|message|share)/gi,m=>'WhatsApp '+m[1],'spell','The app is "WhatsApp".');
 phrase(/\bdis+ap+oint(ed)?\s+about\b/gi,()=>'disappointed in','grammar','We say "disappointed in / with".');
 phrase(/\breply\s+for\b/gi,()=>'reply to','grammar','We "reply to" an email.');
 phrase(/\brefer\s+(my|this|the|attached)\b/gi,m=>'refer to '+m[1],'grammar','We "refer to" something.');
 phrase(/\bdiscuss\s+about\b/gi,()=>'discuss','grammar','"discuss" needs no "about".');
 phrase(/\bexplain\s+me\b/gi,()=>'explain to me','grammar','We "explain to" someone.');
 phrase(/\bmore\s+(better|easier|faster|cheaper|bigger)\b/gi,m=>m[1],'grammar','"'+'better/easier…" already means "more".');
 phrase(/\b(\w+)\s+\1\b/gi,m=>/^(that|had|is)$/i.test(m[1])?null:m[1],'style','The word is repeated.');
 phrase(/\b(want|wants|wanted|need|needs|needed|have|has)\s+(do|make|create|design|know|send|get|add|change|use|see|check|build|give|put|update|fix|learn|take|show|install|draw|calculate|connect|select|save|share|reply|ask|remove|move|try|find|prepare|write|improve|enhance)\b/gi,
  m=>/^(have|has)$/i.test(m[1])&&/^(get)$/i.test(m[2])?m[1]+' to '+m[2]:m[1]+' to '+m[2],'grammar','After want / need / have, add "to" before the verb.');
 // 2. words
 {const re=/[A-Za-z][A-Za-z']*/g;let m;while((m=re.exec(text))){const w=m[0], lw=w.toLowerCase(), s=m.index, e=s+w.length;

   add(s,e,capFirst(r,s),ts?'style':(/'/.test(r)&&!/'/.test(w)?'spell':'spell'),ts?'Write the full word in work messages.':(/'/.test(r)?'Add the apostrophe ( \' ).':'Spelling'));continue;}
  if(lw in PROPER&&PROPER[lw]&&w!==PROPER[lw]){if(lw==='i'&&/[-.'’]/.test(text[s-1]||''))continue;if(lw==='i'&&/^[.']/.test(text[e]||'')&&!/^'(m|ll|ve|d)\b/i.test(text.slice(e)))continue;
   add(s,e,PROPER[lw],'cap',lw==='i'?'"I" is always a capital letter.':'This name / short form uses capitals.');continue;}
 }}
 // 3. a / an
 {const re=/\b(a|an|A|An)\s+([A-Za-z][\w-]*)/g;let m;while((m=re.exec(text))){const art=m[1],nx=m[2];if(/^(or|and|is|are|was|were|has|to)$/i.test(nx))continue;if(art==='A'&&!starts.has(m.index))continue;
  let vowel;if(ACR_VOWEL.test(nx)&&nx.length>1&&nx===nx.toUpperCase())vowel=true;else if(/^[A-Z]{2,}$/.test(nx))vowel=false;else if(SILENT_H.test(nx))vowel=true;else if(/^[aeiou]/i.test(nx))vowel=!AN_EXCEPT.test(nx);else vowel=false;
  const want=vowel?'an':'a';if(art.toLowerCase()!==want){const r=art[0]===art[0].toUpperCase()?want[0].toUpperCase()+want.slice(1):want;add(m.index,m.index+art.length,r,'grammar','Use "'+want+'" before "'+nx+'" ('+(vowel?'vowel':'consonant')+' sound).');}}}

function applyFixes(text,issues){let out=text;issues.slice().sort((a,b)=>b.start-a.start).forEach(x=>{out=out.slice(0,x.start)+x.sugg.split(' / ')[0]+out.slice(x.end);});return out;}
function checkView(){

function markHtml(t,issues){let out='',p=0;issues.forEach((x,i)=>{out+=esc(t.slice(p,x.start))+`<mark class="t-${x.type}" data-act="jump" data-arg="${i}" title="${esc(x.msg)}">${esc(x.orig)||'&nbsp;'}</mark>`;p=x.end;});return out+esc(t.slice(p));}
function runCheck(){CHK.text=$('chkIn').value;if(!CHK.text.trim()){toast('Type or paste a message first');return;}CHK.res=checkText(CHK.text);S.checks++;trackMist(CHK.res.issues,CHK.text);
 if(words(CHK.text).length>=5){if(CHK.plan){S.done[CHK.plan]=true;CHK.plan=null;toast('Plan task done ✓');}addXp(5);}save();render();}

/* =========================================================
   SPEAK & LISTEN
   ========================================================= */
const SPK={list:[],i:0,ok:0,plan:null,heard:null,score:null,mode:'speak',typed:null};
const FRAMED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
const SR=FRAMED?null:(window.SpeechRecognition||window.webkitSpeechRecognition);
if(!SR)SPK.mode='type';
function speakView(){
 if(!SPK.list.length){SPK.list=pick(PHRASES,6);SPK.i=0;SPK.ok=0;}
 if(SPK.i>=SPK.list.length){if(SPK.plan){S.done[SPK.plan]=true;SPK.plan=null;save();}
  return `<div class="card center" style="margin-top:10px"><div style="font-size:34px">🎙️</div><b>Session complete</b><div class="small muted">${SPK.ok} of ${SPK.list.length} phrases matched well.</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn alt" data-act="spkagain">New phrases</button><button class="btn" data-act="finish">Done</button></div></div>`;}
 const p=SPK.list[SPK.i];
 let h=`<div class="prog"><button class="btn ghost sm" data-act="quit">✕</button><div class="grow bar"><i style="width:${Math.round(SPK.i/SPK.list.length*100)}%"></i></div><span class="small muted">${SPK.i+1}/${SPK.list.length}</span></div>
 <div class="row" style="margin-bottom:10px"><button class="btn sm ${SPK.mode==='speak'?'':'ghost'}" data-act="spkmode" data-arg="speak">🎙️ Speak</button><button class="btn sm ${SPK.mode==='type'?'':'ghost'}" data-act="spkmode" data-arg="type">🎧 Listen &amp; type</button></div>`;
 if(SPK.mode==='speak'){
  h+=`<div class="card"><div class="tiny muted">1. LISTEN · 2. SAY IT</div><div class="q" style="margin-top:6px">${esc(p)}</div><button class="btn alt sm" data-act="say" data-arg="${esc(p)}">🔊 Listen</button></div>`;
  if(!SR)h+=`<div class="card small">${FRAMED?'Speaking practice needs the microphone, which works in the installed phone app (GitHub Pages version). Here, use <b>Listen &amp; type</b>.':'Speech recognition is not available in this browser. Use Chrome on Android, or switch to <b>Listen &amp; type</b>.'}</div>`;
  else h+=`<div class="center" style="margin:16px 0"><button class="btn mic" id="micBtn" data-act="mic">🎙️</button><div class="small muted" style="margin-top:6px">Tap and say the sentence</div></div>`;
  if(SPK.heard!=null)h+=`<div class="fb ${SPK.score>=.8?'ok':'no'}"><b>${SPK.score>=.8?'✓ Clear!':'Try again'}</b> (${Math.round(SPK.score*100)}% match)<div class="small" style="margin-top:4px">I heard: “${esc(SPK.heard)}”</div><div class="small" style="margin-top:4px">${diffHtml(SPK.heard,p)}</div></div>`;
 } else {
  h+=`<div class="card"><div class="tiny muted">LISTEN, THEN TYPE WHAT YOU HEAR</div><div class="row" style="margin:10px 0"><button class="btn alt" data-act="say" data-arg="${esc(p)}">🔊 Play</button><button class="btn ghost sm" data-act="slow" data-arg="${esc(p)}">🐢 Slow</button></div>
  <textarea class="txt" id="spkIn" rows="2" placeholder="Type the sentence" ${SPK.typed?'disabled':''}>${SPK.typed?esc(SPK.typed.v):''}</textarea></div>`;
  if(SPK.typed)h+=`<div class="fb ${SPK.typed.s>=.9?'ok':'no'}"><b>${SPK.typed.s>=.9?'✓ Correct!':Math.round(SPK.typed.s*100)+'% match'}</b><div style="margin-top:4px">${diffHtml(SPK.typed.v,p)}</div></div>`;
  else h+=`<button class="btn" style="width:100%;margin-top:4px" data-act="spkcheck">Check</button>`;
 }
 h+=`<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="spknext">${SPK.i+1<SPK.list.length?'Next phrase ›':'Finish'}</button></div>`;
 return h;}
let rec=null;
function mic(){if(!SR)return;try{if(rec){rec.stop();return;}rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=3;
 const b=$('micBtn');if(b)b.classList.add('live');
 rec.onresult=e=>{const alts=Array.from(e.results[0]).map(a=>a.transcript);const p=SPK.list[SPK.i];let best=alts[0],bs=0;alts.forEach(a=>{const s=sim(a,p);if(s>bs){bs=s;best=a;}});
  const first=SPK.heard==null||SPK.score<.8;SPK.heard=best;SPK.score=bs;if(bs>=.8&&first){SPK.ok++;addXp(10);}};
 rec.onerror=e=>{toast(e.error==='not-allowed'?'Allow the microphone for this site':'Could not hear clearly. Try again.');};
 rec.onend=()=>{rec=null;render();};rec.start();}catch(e){rec=null;toast('Microphone not available');}}

/* =========================================================
   MY REPORT
   ========================================================= */
function meView(){
 const total=Object.values(S.stats).reduce((a,s)=>a+s.t,0), right=Object.values(S.stats).reduce((a,s)=>a+s.r,0);
 let h=`<h2>My English report</h2>${reportCard()}
 <div class="grid2" style="margin-bottom:12px"><div class="stat"><b>${total?Math.round(right/total*100)+'%':'—'}</b><span class="small">overall correct</span></div><div class="stat"><b>${S.streak.count||0}</b><span class="small">day streak</span></div><div class="stat"><b>${S.xp}</b><span class="small">XP</span></div><div class="stat"><b>${Object.keys(S.weak).length}</b><span class="small">items to review</span></div></div>
 <div class="card"><h3>Your level</h3>${(S.place||[]).length?S.place.map(p=>`<div class="small" style="margin:4px 0">${esc(p.d)}: <b>${esc(p.lvl)}</b> (${p.pct}%)</div>`).join('')+`<div class="small muted" style="margin-top:6px">${esc(LEVEL_DESC[S.place[S.place.length-1].lvl]||'')}</div>`:'<div class="small muted">Not checked yet.</div>'}<div style="margin-top:10px"><button class="btn sm alt" data-act="place">Take the level check</button></div></div>
 <div class="card"><h3>Tests</h3><div class="small">Level 1 — mid: <b>${S.tests.mid!=null?S.tests.mid+'%':'not taken'}</b> · final: <b>${S.tests.final!=null?S.tests.final+'%':'not taken'}</b></div><div class="small" style="margin-top:4px">Level 2 — mid: <b>${S.tests.mid2!=null?S.tests.mid2+'%':'not taken'}</b> · final: <b>${S.tests.final2!=null?S.tests.final2+'%':'not taken'}</b></div><div class="small" style="margin-top:4px">Course — mid: <b>${S.tests.mid3!=null?S.tests.mid3+'%':'not taken'}</b> · final: <b>${S.tests.final3!=null?S.tests.final3+'%':'not taken'}</b></div></div>
 <div class="card"><h3>Full course progress</h3><div class="small">Grammar topics read: <b>${courseIds().filter(i=>S.read[i]).length} of ${courseIds().length}</b></div><div class="small" style="margin-top:4px">Reading texts done: <b>${Object.keys(S.readDone||{}).length} of ${READS.length}</b> · Pronunciation topics: <b>${Object.keys(S.pronDone||{}).length} of ${PRON.length}</b></div></div>
 <div class="card"><h3>Vocabulary and writing</h3><div class="small">Words started: <b>${Object.keys(S.vocab||{}).length}</b> · mastered: <b>${Object.values(S.vocab||{}).filter(v=>v.b>=5).length}</b> · your own words: <b>${(S.myWords||[]).length}</b></div><div class="small" style="margin-top:4px">Writing tasks done: <b>${S.writes||0}</b></div></div>
 <div class="card"><h3>What your chats showed</h3><p class="small muted" style="margin-top:0">From your messages to Claude, Aug–Nov 2026. Biggest problems first.</p>`;
 const findings=[
  ['spellA','Spelling','48 work words were misspelled, e.g. piority, nessosiry, hilited, braker, comfermation.'],
  ['caps','Small "i" and missing capitals','Almost every message: "i want…", excel, whatsapp, autocad, sri lanka.'],
  ['art','Missing a / an / the','"create app", "made mistake", "a expenation", "to desktop".'],
  ['verb','Verb patterns','"want do", "it doesent fill", "have get to notised", "still not fix".'],
  ['sent','Very long sentences','Long requests with no full stops, which are easy to misread.'],
  ['conf','Sound-alike words','raw/row, massage/message, lace/place, lake/like, procumbent/procurement.'],
  ['prep','Prepositions','"reply for", "refer my sketch", "log as", "disappointed about".'],
  ['work','Chat style at work','"u", "bro", "please send me as zip".']];
 findings.forEach(([id,t,d])=>{const p=unitPct(id==='spellA'?'spellA':id);const p2=id==='spellA'?unitPct('spellB'):null;const pp=p!=null&&p2!=null?Math.round((p+p2)/2):(p!=null?p:p2);
  h+=`<div class="task" data-act="unit" data-arg="${id}" style="cursor:pointer"><div class="grow"><b>${esc(t)}</b><div class="small muted">${esc(d)}</div>${pp!=null?`<div class="bar" style="margin-top:6px"><i style="width:${pp}%;background:${pp>=80?'var(--ok)':pp>=60?'var(--acc)':'var(--bad)'}"></i></div><div class="tiny muted">Your practice score: ${pp}%</div>`:''}</div><span class="muted">›</span></div>`;});
 h+=`</div><div class="card"><h3>What you already do well</h3><ul class="rules small"><li>Strong technical vocabulary: MCCB, busbar, azimuth, trunking, curtailment.</li><li>When you write slowly, your English is clear and correct, for example: “I couldn't get the final output from the automatic graph to C41 and C42.”</li><li>Your instructions are detailed and specific. Clear sentences will make them even easier to follow.</li></ul></div>
 ${(()=>{const e=iest(),I=IE();return `<div class="card" data-act="iresults" style="cursor:pointer"><h3>🎓 IELTS</h3><div class="small">Estimated bands — Listening <b>${e.L!=null?fb(e.L):'—'}</b> · Reading <b>${e.R!=null?fb(e.R):'—'}</b> · Writing <b>${e.W!=null?fb(e.W):'—'}</b> · Speaking <b>${e.S!=null?fb(e.S):'—'}</b>${e.O!=null?` · Overall <b>${fb(e.O)}</b>`:''}</div><div class="small muted" style="margin-top:4px">${I.res.length} tests · ${I.essays.length} essays · ${I.mocks.length} mock tests — tap for details</div></div>`;})()}<div class="card"><h3>Settings</h3><div class="small muted">Progress is saved on this device only.</div><div class="row" style="margin-top:10px"><button class="btn warn sm" data-act="reset">Reset my progress</button></div><div class="tiny muted" style="margin-top:12px">English Coach · built for K U S Panagoda</div></div>`;
 return h;}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click',e=>{
 const nb=e.target.closest('nav.bottom button');if(nb){R=null;go(nb.dataset.tab);return;}
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act, arg=el.dataset.arg;
 if(IACT[a]){IACT[a](arg,el,e);return;}
 switch(a){
 case 'say':speak(arg);break;
 case 'slow':try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(arg);u.lang='en-GB';u.rate=.6;speechSynthesis.speak(u);}catch(err){}break;
 case 'day':setDay(+arg);render();break;
 case 'sect':LAST_SECT=arg;go('learn',{type:'sect',id:arg});break;
 case 'learnroot':LAST_SECT=null;go('learn');break;
 case 'openread':go('learn',{type:'read',id:arg});break;
 case 'openpron':go('learn',{type:'pron',id:arg});break;
 case 'readq':{const r=READS.find(x=>x.id===arg);startRun(r.q.map((_,i)=>ITEMS['rd-'+r.id+'-'+i]),'Reading: '+r.title,{keepOrder:true,readId:arg,plan:SUB&&SUB.plan});break;}
 case 'pronq':{const pp=PRON.find(x=>x.id===arg);startRun(pronItems(pp),'Pronunciation: '+pp.title,{pronId:arg,plan:SUB&&SUB.plan,n:10});break;}
 case 'pronok':{const pl=SUB&&SUB.plan;S.pronDone=Object.assign({},S.pronDone,{[arg]:true});if(pl)S.done[pl]=true;addXp(5);toast('Practised ✓');if(pl)go('home');else render();break;}
 case 'pronsay':{const pp=PRON.find(x=>x.id===arg);SPK.plan=null;SPK.list=pp.words.slice(0,8);SPK.i=0;SPK.ok=0;SPK.heard=null;SPK.typed=null;go(TAB,{type:'speak'});break;}
 case 'addkw':{const [rid,ix]=arg.split(':');const k=READS.find(x=>x.id===rid).kw[+ix];if(allWords().some(x=>x.w.toLowerCase()===k[0].toLowerCase())){toast('Already in your word list');break;}
  S.myWords=(S.myWords||[]).concat([{id:'my-'+WID(k[0]).slice(2),w:k[0],d:k[1],si:k[2],ex:''}]);save();toast('Added to My words ✓');break;}
 case 'irreg':startRun(irregItems(12),'Irregular verbs',{});break;
 case 'vfocus':S.vfocus=arg;save();render();break;
 case 'lvl':S.lvl=+arg;setDay(currentDay());render();break;
 case 'gowords':go('words');break;
 case 'vnew':startFlash(newList(8));break;
 case 'vnewt':startFlash(newList(8,arg));break;
 case 'vrev':{const dl=dueList();if(dl.length)startRun(dl.slice(0,15).map(w=>vItem(w)),'Review your words',{});break;}
 case 'vquiz':{const ws=allWords().filter(w=>S.vocab[w.id]);if(ws.length)startRun(pick(ws,10).map(w=>vItem(w)),'Word quiz',{});break;}
 case 'vquizt':{const ws=(arg==='mine'?allWords().filter(w=>w.topic==='mine'):topicWords(arg)).filter(w=>S.vocab[w.id]);if(ws.length)startRun(pick(ws,10).map(w=>vItem(w)),'Word quiz',{});break;}
 case 'topic':go('words',{type:'topic',id:arg});break;
 case 'wback':go('words');break;
 case 'fshow':FL.show=true;render();break;
 case 'fknow':flashMark(true);break;
 case 'fnew':flashMark(false);break;
 case 'addword':{const w=$('mwW').value.trim(),d=$('mwD').value.trim();if(!w||!d){toast('Add the word and its meaning');return;}
  const id='my-'+WID(w).slice(2);if(allWords().some(x=>x.id===id||x.w.toLowerCase()===w.toLowerCase())){toast('That word is already in your list');return;}
  S.myWords=(S.myWords||[]).concat([{id,w,d,si:$('mwS').value.trim(),ex:$('mwE').value.trim()}]);save();toast('Word added ✓');render();break;}
 case 'delword':S.myWords=(S.myWords||[]).filter(x=>x.id!==arg);delete S.vocab[arg];save();render();break;
 case 'write':startWrite(null);break;
 case 'wcheck':wCheck();break;
 case 'wmodel':{const el=$('wrIn');if(el)WR.text=el.value;WR.model=!WR.model;render();break;}
 case 'wnext':WR.i=(WR.i+1)%PROMPTS.length;WR.res=null;WR.text='';WR.model=false;render();break;
 case 'wfix':{WR.text=applyFixes(WR.res.text,WR.res.chk.issues);const el=$('wrIn');if(el)el.value=WR.text;wCheck();break;}
 case 'wdone':{const el=$('wrIn');if(el)WR.text=el.value;S.writes=(S.writes||0)+1;trackMist(checkText(WR.text).issues,WR.text);if(WR.plan)S.done[WR.plan]=true;addXp(15);toast('Writing saved ✓');SUB=null;go(TAB);break;}
 case 'place':startRun(placeItems(),'Level check',{place:true,keepOrder:true});break;
 case 'speakm':SPK.plan=null;SPK.list=pick(MEET_PHRASES,6);SPK.i=0;SPK.ok=0;SPK.heard=null;SPK.typed=null;go(TAB,{type:'speak'});break;
 case 'task':{const [d,t]=arg.split(':').map(Number);startTask(d,t);break;}
 case 'unit':go('learn',{type:'unit',id:arg});break;
 case 'back':if(LAST_SECT)go('learn',{type:'sect',id:LAST_SECT});else go('learn');break;
 case 'read':S.read[arg]=true;if(SUB&&SUB.plan){S.done[SUB.plan]=true;}addXp(5);toast('Lesson done ✓');if(SUB&&SUB.plan)go('home');else render();break;
 case 'drill':startRun(spellSet(arg),'Spelling drill: set '+arg,{n:12});break;
 case 'uquiz':startRun(unitMcq(arg),unitById(arg).title+' — quiz',{n:10});break;
 case 'ufix':startRun(unitFix(arg),'Fix real sentences',{});break;
 case 'review':{const it=weakItems();if(it.length)startRun(it,'Review your mistakes',{review:true});break;}
 case 'quick':startRun(pick(all('mcq'),10),'Quick quiz',{});break;
 case 'fixmix':startRun(pick(all('fix'),8),'Fix real sentences',{});break;
 case 'speak':SPK.plan=null;SPK.list=pick(PHRASES,6);SPK.i=0;SPK.ok=0;SPK.heard=null;SPK.typed=null;go(TAB,{type:'speak'});break;
 case 'test':startTest(arg,null);break;
 case 'opt':answerMcq(+arg);break;
 case 'submit':submit();break;
 case 'next':next();break;
 case 'hint':{const it=cur();const hb=$('hintBox');if(hb)hb.innerHTML='💡 '+esc(it.h||'Look at capitals, spelling and small words.');break;}
 case 'override':override();break;
 case 'quit':if(R&&R.i>0&&R.i<R.items.length)toast('Your answers so far are saved');R=null;SUB=null;render();break;
 case 'retry':startRun(R.wrongIds.map(id=>ITEMS[id]),'Practise again',{});break;
 case 'finish':{const pl=R&&R.opt&&R.opt.plan;R=null;SUB=null;go(pl?'home':TAB);break;}
 case 'runcheck':runCheck();break;
 case 'clearcheck':CHK.text='';CHK.res=null;render();break;
 case 'saycheck':{const v=$('chkIn').value;if(v.trim())speak(v);break;}
 case 'fixone':{const x=CHK.res.issues[+arg];CHK.text=applyFixes(CHK.text,[x]);CHK.res=checkText(CHK.text);render();break;}
 case 'usefix':CHK.text=applyFixes(CHK.text,CHK.res.issues);CHK.res=checkText(CHK.text);render();break;
 case 'copyfix':{const t=applyFixes(CHK.text,CHK.res.issues);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied ✓')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied ✓');}catch(err){}ta.remove();});break;}
 case 'jump':{const t=$('iss'+arg);if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.style.background='var(--prisoft)';setTimeout(()=>t.style.background='',1200);}break;}
 case 'mic':mic();break;
 case 'spkmode':SPK.mode=arg;SPK.heard=null;SPK.typed=null;render();break;
 case 'spkcheck':{const v=($('spkIn').value||'').trim();if(!v){toast('Type what you heard');return;}const s=sim(v,SPK.list[SPK.i]);SPK.typed={v,s};if(s>=.9){SPK.ok++;addXp(10);}render();break;}
 case 'spknext':SPK.i++;SPK.heard=null;SPK.score=null;SPK.typed=null;render();break;
 case 'spkagain':SPK.list=pick(PHRASES,6);SPK.i=0;SPK.ok=0;render();break;
 case 'reset':if(el.dataset.armed!=='1'){el.dataset.armed='1';el.textContent='Tap again to reset everything';setTimeout(()=>{if(el.isConnected){el.dataset.armed='';el.textContent='Reset my progress';}},4000);break;}
  try{localStorage.removeItem(KEY);}catch(err){}S=blank();save();hdr();go('home');toast('Progress reset');break;
 }});
document.addEventListener('input',e=>{if(e.target.id==='chkIn')CHK.text=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='spkIn'&&!e.shiftKey){e.preventDefault();const b=document.querySelector('[data-act="spkcheck"]');if(b)b.click();}});
try{speechSynthesis&&speechSynthesis.getVoices();}catch(e){}
S.lvl=S.lvl||1;setDay(currentDay());hdr();go('home');
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});});}
</script>
