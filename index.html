<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233F">
<title>English Coach</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Coach">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2333;--muted:#5b6578;--pri:#1f4e8c;--pri2:#2f6fbf;--prisoft:#e8f0fb;--acc:#e59a0b;--accsoft:#fdf3df;--ok:#1d7f46;--okbg:#e5f4eb;--bad:#b83227;--badbg:#fbe9e7;--line:#e2e7ef;--shadow:0 1px 3px rgba(20,30,60,.08);}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#1a2130;--ink:#e8edf6;--muted:#9aa6bb;--pri:#6aa3ec;--pri2:#8ab8f2;--prisoft:#1d2c44;--acc:#f0b64a;--accsoft:#3a2f17;--ok:#5ccf8a;--okbg:#173525;--bad:#f07c70;--badbg:#3d1d1a;--line:#2b3446;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Sinhala","Iskoola Pota",sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme:dark){header.top{background:#172a47}}
header.top h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
.pill{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:flex;width:100%;max-width:720px}
nav.bottom button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
nav.bottom button .ic{font-size:20px;line-height:1}
nav.bottom button.on{color:var(--pri);font-weight:700}
h2{font-size:20px;margin:6px 0 10px}
h3{font-size:17px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}
.si{color:var(--muted);font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;background:var(--pri);color:#fff;font-weight:650;cursor:pointer;min-height:44px;text-decoration:none}
.btn.alt{background:var(--prisoft);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.btn.warn{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:44px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);cursor:pointer}
.day b{font-size:17px;color:var(--ink)}
.day.done{background:var(--okbg);border-color:transparent}
.day.done b{color:var(--ok)}
.day.sel{outline:2px solid var(--pri);outline-offset:1px}
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.chk.on{background:var(--ok);border-color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri2);border-radius:99px}
.unit{display:flex;gap:12px;align-items:center;cursor:pointer}
.unit .em{width:44px;height:44px;border-radius:12px;background:var(--prisoft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
ul.rules{margin:6px 0 0;padding-left:20px}ul.rules li{margin:6px 0}
.ex{display:grid;grid-template-columns:1fr;gap:6px}
.pair{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.right{color:var(--ok);font-weight:600}
.say{border:0;background:var(--prisoft);color:var(--pri);border-radius:8px;padding:2px 8px;margin-left:6px;cursor:pointer;font-size:14px;vertical-align:middle}
.q{font-size:18px;font-weight:600;margin:4px 0 12px}
.from{background:var(--accsoft);border-left:4px solid var(--acc);padding:9px 11px;border-radius:8px;margin:0 0 12px;font-size:15.5px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:12px;padding:11px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
input.txt,textarea.txt{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--card);outline:none}
input.txt:focus,textarea.txt:focus{border-color:var(--pri2)}
textarea.txt{min-height:110px;resize:vertical}
.ins{background:var(--okbg);color:var(--ok);font-weight:600;border-radius:3px;padding:0 2px}
.del{background:var(--badbg);color:var(--bad);text-decoration:line-through;border-radius:3px;padding:0 2px}
mark{background:none;border-bottom:2.5px solid var(--bad);color:inherit;cursor:pointer;padding:0 1px}
mark.t-style{border-bottom-color:var(--acc)}
mark.t-cap{border-bottom-color:var(--pri2)}
.issue{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.issue:first-child{border-top:0}
.tag{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:6px;background:var(--badbg);color:var(--bad);white-space:nowrap}
.tag.t-style{background:var(--accsoft);color:var(--acc)}.tag.t-cap{background:var(--prisoft);color:var(--pri)}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.big{font-size:42px;font-weight:800;color:var(--pri);line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--prisoft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;color:var(--pri)}
.center{text-align:center}
.mic{width:76px;height:76px;border-radius:50%;font-size:30px}
.mic.live{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2333;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
a{color:var(--pri)}

/* ===== design refresh ===== */
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--grad:linear-gradient(135deg,#163a6b 0%,#1f4e8c 48%,#2f6fbf 100%);--shadow:0 1px 2px rgba(16,24,40,.05),0 3px 12px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--grad:linear-gradient(135deg,#0e203d 0%,#16345f 55%,#1f4e8c 100%);--shadow:none}}
header.top,body header.top{background:var(--grad);box-shadow:0 2px 14px rgba(10,30,70,.18);gap:8px}
header.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header.top .logo{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;letter-spacing:.4px}
.hbtn{flex:0 0 auto;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;width:36px;height:30px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.hbtn:active{background:rgba(255,255,255,.3)}
@media (max-width:370px){header.top .logo{display:none}.pill{padding:3px 8px}}
.card{border-radius:16px}
h2{font-size:22px;letter-spacing:-.2px}
nav.bottom{box-shadow:0 -2px 14px rgba(16,24,40,.06)}
nav.bottom button{font-size:11.5px}
nav.bottom button .ic{padding:3px 12px;border-radius:999px;transition:background .15s}
nav.bottom button.on .ic{background:var(--prisoft)}
.btn{transition:transform .08s ease,filter .15s}
.btn:active{transform:scale(.97)}
:root{--btn1:#2f6fbf;--btn2:#1f4e8c}
@media (prefers-color-scheme:dark){:root{--btn1:#3a7bd0;--btn2:#245597}}
.btn:not(.alt):not(.ghost):not(.warn){background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff}
.unit .em{border-radius:14px}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.lvls .btn{padding:7px 4px;font-size:14px;min-height:46px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
.qa .ic{font-size:20px;line-height:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid3 .stat b,.grid4 .stat b{font-size:19px}
/* ===== IELTS ===== */
.ihero{background:var(--grad);color:#fff;border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:0 6px 20px rgba(20,60,120,.22)}
.seg{display:inline-flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px;gap:2px;flex-wrap:nowrap}
.seg button{border:0;background:none;color:inherit;padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:#1f4e8c}
.seg.light{background:var(--prisoft)}.seg.light button{color:var(--pri)}.seg.light button.on{background:var(--btn2);color:#fff}
.seg.wrap{flex-wrap:wrap;border-radius:14px}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.bands div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 4px;text-align:center}
.bands b{display:block;font-size:22px;line-height:1.15}.bands span{font-size:11px;opacity:.92}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-height:112px}
.tile.sm{min-height:0;padding:11px 12px;gap:5px}
.tile .ti{font-size:26px;line-height:1.1}.tile b{font-size:15.5px}.tile .small{line-height:1.35}.tile .bar{margin-top:auto}
.ihead{margin:4px 2px 6px;letter-spacing:.5px}
.itable{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.itable th,.itable td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.itable th{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
.itable td i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.guide h3{margin:16px 0 6px;font-size:16.5px;color:var(--pri)}.guide h3:first-child{margin-top:0}
.guide p,.guide li{font-size:15.5px}.guide ul,.guide ol{padding-left:20px}.guide li{margin:4px 0}
.sticky{position:sticky;top:calc(50px + env(safe-area-inset-top));z-index:4;background:var(--bg);padding:8px 0 8px;margin:-8px 0 8px;border-bottom:1px solid var(--line)}
.wbar{display:flex;align-items:center;gap:8px}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;border-radius:999px;padding:6px 11px;background:var(--prisoft);color:var(--pri);border:0;cursor:pointer;font-size:13.5px;white-space:nowrap}
.timer.low{background:var(--accsoft);color:var(--acc)}.timer.over{background:var(--badbg);color:var(--bad)}
.wc{font-weight:700;font-size:13px;border-radius:999px;padding:5px 10px;background:var(--badbg);color:var(--bad);white-space:nowrap;font-variant-numeric:tabular-nums}
.wc.ok{background:var(--okbg);color:var(--ok)}
.passage p{font-size:16.5px;line-height:1.75;margin:0 0 14px}
.passage .pl{display:inline-flex;width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;background:var(--btn2);color:#fff;font-weight:800;font-size:13px;margin-right:8px;vertical-align:1px}
.qi{padding:12px 0;border-top:1px solid var(--line)}.qg .qi:first-of-type{border-top:0}
.qi.good .qn{background:var(--okbg);color:var(--ok)}.qi.bad .qn{background:var(--badbg);color:var(--bad)}
.qn{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;background:var(--prisoft);color:var(--pri);font-weight:800;font-size:13px;margin-right:8px;padding:0 5px;flex:0 0 auto}
.gapq{line-height:2.2}
.formhead{font-weight:800;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--pri);border-bottom:2px solid var(--prisoft);padding-bottom:4px;margin:6px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px;color:var(--ink)}
.chip.on{border-color:var(--btn2);background:var(--btn2);color:#fff}
.chip.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}.chip.no{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt.on{border-color:var(--pri);background:var(--prisoft)}
.gapin{width:150px;max-width:58vw;border:0;border-bottom:2px solid var(--pri2);background:var(--prisoft);border-radius:6px 6px 0 0;padding:4px 8px;margin:0 3px;outline:none;font-weight:600}
.gapin:focus{border-bottom-color:var(--acc)}
select.sel{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;min-width:64px}
.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--pri2) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center;margin:8px auto}
.ring>div{width:96px;height:96px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:26px;line-height:1.05;color:var(--pri)}
.ring.sm{width:62px;height:62px;margin:0;flex:0 0 auto}.ring.sm>div{width:48px;height:48px}.ring.sm b{font-size:14px}
.hl-l{background:rgba(42,120,214,.15);border-radius:4px;padding:0 2px}
.hl-a{border-bottom:2px solid var(--c3)}
.essay{white-space:pre-wrap;line-height:1.75;font-size:15.5px}
textarea.essayin{min-height:300px;line-height:1.6;font-size:16px}
.chk2{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit}
.chk2:first-of-type{border-top:0}.chk2 .ico{flex:0 0 22px;text-align:center}
.btnrow{cursor:pointer}
.pill2{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--prisoft);color:var(--pri);margin:2px 0;white-space:nowrap}
.pill2.g{background:var(--okbg);color:var(--ok)}.pill2.r{background:var(--badbg);color:var(--bad)}
.cue{background:var(--accsoft);border:1.5px dashed var(--acc);border-radius:16px;padding:14px 16px}
.livebox{min-height:72px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:15px;white-space:pre-wrap;text-align:left;margin-top:4px}
.tline{padding:7px 0;border-top:1px solid var(--line);font-size:15px}.tline b{color:var(--pri)}
.chart{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}.chart text{fill:var(--muted);font-size:14.5px;font-family:inherit}.chart .lab{fill:var(--ink);font-weight:700;font-size:14.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;margin:4px 0 6px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
details.more>summary{cursor:pointer;color:var(--pri);font-weight:600;font-size:14.5px;padding:2px 0}
details.more[open]>summary{margin-bottom:6px}
.pos{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--pri);background:var(--prisoft);border-radius:6px;padding:1px 6px;vertical-align:1px}
.em2{width:40px;height:40px;border-radius:12px;background:var(--prisoft);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.lhead{border-left:4px solid var(--pri2)}
.hide{display:none}
body.iwide main{max-width:1180px}
@media (min-width:980px){.rgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}.rgrid>div{max-height:calc(100vh - 200px);overflow:auto;position:sticky;top:150px;padding-right:4px}.rgrid>.hide{display:block}.rpane-toggle{display:none!important}}

/* ===== report tab ===== */
nav.bottom button{font-size:11px;padding:8px 0 9px}
nav.bottom button .ic{padding:3px 10px}
@media (max-width:360px){nav.bottom button{font-size:10px}nav.bottom button .ic{padding:3px 6px}}
.rcard{border:1.5px solid var(--pri2)}
textarea.rpout{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;min-height:300px;white-space:pre-wrap}

:root{--bg:#F2F5F7;--card:#FFFFFF;--ink:#16233F;--muted:#56677E;--pri:#0E7C86;--pri2:#14919C;--prisoft:#E2F1F2;--acc:#9A6400;--accsoft:#FFF3D6;--ok:#1F8A5B;--okbg:#E2F3EA;--bad:#C2372E;--badbg:#FCE9E7;--line:#DCE3EA;--sun:#F2A20C;--night:#16233F;--btn1:#14919C;--btn2:#0E7C86;--shadow:none;--grad:linear-gradient(165deg,#16233F 0%,#1E3A5E 100%);--display:'ECSerif',Georgia,'Times New Roman',serif}
@media (prefers-color-scheme:dark){:root{--bg:#0D1626;--card:#152138;--ink:#E8EEF6;--muted:#9DAABF;--pri:#45C3CC;--pri2:#62D0D8;--prisoft:#123445;--acc:#F5B731;--accsoft:#382C10;--ok:#52CF8D;--okbg:#14352A;--bad:#F08077;--badbg:#3C1E1B;--line:#25344F;--sun:#F5B731;--night:#0A1220;--btn1:#159AA5;--btn2:#0F7F89;--grad:linear-gradient(165deg,#0A1220 0%,#17305A 100%)}}
body header.top{background:var(--night);box-shadow:none;border-bottom:1px solid rgba(255,255,255,.07)}
header.top h1{font-family:var(--display);font-weight:700;font-size:19.5px;letter-spacing:.1px}
header.top .logo{background:none;width:30px;height:30px;border-radius:9px}
header.top .logo svg{width:30px;height:30px;display:block}
@media (max-width:370px){header.top .logo{display:flex}}
.pill{background:rgba(255,255,255,.09);font-variant-numeric:tabular-nums}
#hStreak{color:#FFD36E}
h2,h3,.big,.stat b,.bands b,.ring b,.q,.tile b,.unit b,.day b{font-family:var(--display)}
h2{font-size:25px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
h3{font-size:18px;font-weight:700;line-height:1.3}
.q{font-size:19px;font-weight:700;line-height:1.4}
.unit b,.tile b{font-weight:700;letter-spacing:.1px}
.card{border-radius:16px;box-shadow:none}
.tile,.qa button{box-shadow:none}
.btn{border-radius:12px}
.btn:not(.alt):not(.ghost):not(.warn){background:var(--btn2)}
.btn.alt{background:var(--prisoft);color:var(--pri)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
nav.bottom{box-shadow:none}
nav.bottom button .ic{display:flex;align-items:center;justify-content:center;height:30px;padding:0 13px;border-radius:999px}
nav.bottom .ic svg,.qa .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.on .ic{background:var(--prisoft)}
@media (max-width:360px){nav.bottom button .ic{padding:0 8px}}
.qa button{color:var(--pri)}.qa button span:last-child{color:var(--ink)}
.qa .ic{display:flex}
.lvls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.lvls .btn{border:0;border-radius:10px;min-height:44px}
.lvls .btn.ghost{background:transparent;color:var(--muted)}
/* home hero: the day's sun */
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:16px 18px 16px;margin:0 0 12px}
.hero-row{display:flex;align-items:center;gap:8px}
.hero-kicker{flex:1;font-size:14px;color:rgba(255,255,255,.75)}
.hero-pill{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px}
.sunarc{display:block;width:100%;max-width:250px;height:auto;margin:6px auto 2px}
.sa-horizon{stroke:rgba(255,255,255,.22);stroke-width:1.5}
.sa-track{fill:none;stroke:rgba(255,255,255,.14);stroke-width:9;stroke-linecap:round}
.sa-fill{fill:none;stroke:var(--sun);stroke-width:9;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--off);animation:saDraw 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes saDraw{from{stroke-dashoffset:var(--len)}}
.sa-sun{fill:var(--sun)}.sa-glow{fill:var(--sun);opacity:.22}
.sa-sunG{animation:saSun .5s .75s ease-out both}
@keyframes saSun{from{opacity:0}}
.sa-num{font-family:var(--display);font-size:27px;font-weight:800;fill:#fff}
.sa-lab{font-size:11.5px;fill:rgba(255,255,255,.72)}
.hero-title{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.25;text-align:center;margin:4px 0 12px}
.hero .hero-cta{width:100%;background:var(--sun)!important;color:#1D1400!important;font-weight:750;min-height:48px}
.ihero .row .grow>div:last-child{font-family:var(--display)}
.meter{height:6px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;background:#fff;border-radius:99px}
.hero-foot{font-size:13px;color:rgba(255,255,255,.72);margin-top:6px;text-align:center}

{id:'fut',lv:2,icon:'⏩',title:'Talking about the future',exTitle:'Examples (some from your chats)',

 ],

 ],

{id:'modal',lv:2,icon:'🧭',title:'must, should, could, can, might',exTitle:'Examples (some from your chats)',

  'After a modal: base verb, no "to", no "-s": It should <b>work</b> (not "should works" or "should to work").',

 ],

 ],

 ]},
{id:'cond',lv:2,icon:'🔀',title:'If sentences (conditionals)',exTitle:'Examples (some from your chats)',

 ],

 ],

 ],

 si:'සිංහලේ "වෙනවා" නැතුවම කියනවා — ඉංග්‍රීසියේ is / are අනිවාර්යයි: The roof IS weak.',
 rules:[
  'I <b>am</b> · he / she / it <b>is</b> · we / you / they <b>are</b>. Past: I / he / she / it <b>was</b> · we / you / they <b>were</b>.',
  'Don\'t leave "be" out: "The roof weak" ✗ → "The roof <b>is</b> weak" ✓.',
  'Negative and question: It <b>isn\'t</b> ready. <b>Is</b> it ready? <b>Are</b> they on site?',
  '<b>There is</b> + one thing, <b>There are</b> + more than one: There is a crack in the sheet. There are two inverters.',
  'Short forms in messages: I\'m, it\'s, they\'re, there\'s, isn\'t, aren\'t.'
 ],
 ex:[['site visit tomorrow ok?','Is the site visit tomorrow OK?'],['the cable too short','The cable is too short.'],['there is two inverters','There are two inverters.']],
 q:[
  {q:'The roof ___ very old.',o:['is','are','be'],a:0,why:'"The roof" = it → is.'},
  {q:'___ two breakers in the panel.',o:['There is','There are','It has'],a:1,why:'Two things → There are.'},
  {q:'___ the panels clean now?',o:['Is','Are','Do'],a:1,why:'"the panels" = they → Are.'},
  {q:'The drawings ___ ready yesterday.',o:['was','were','are'],a:1,why:'Plural, past → were.'},
  {q:'Which is correct?',o:['The cable too short.','The cable is too short.','The cable are too short.'],a:1,why:'Don\'t leave out "is".'},
  {q:'There ___ a problem with the meter.',o:['is','are','be'],a:0,why:'One problem → There is.'}
 ],
 f:[
  {w:'the cable too short',a:['The cable is too short.'],h:'Add the missing verb.'},
  {w:'there is two inverters on roof',a:['There are two inverters on the roof.'],h:'Two inverters → there are; and "the roof".'}
 ]},
{id:'noun',lv:3,band:'A1',icon:'🟢',title:'Plurals, countable and uncountable nouns',
 intro:'Some nouns can be counted (one panel, two panels); others cannot (information, equipment). This changes the words you use with them.',
 si:'information, equipment, advice, feedback වලට "s" දාන්නේ නැහැ — informations කියන්නේ නැහැ.',
 rules:[
  'Plural: add <b>-s</b> (panels), <b>-es</b> after s, x, ch, sh (boxes, switches), consonant + y → <b>-ies</b> (batteries). Irregular: man → men, person → people.',
  'Uncountable nouns have no plural and no "a": <b>information, equipment, advice, software, feedback, furniture, money, work, traffic</b>. Say "some equipment", not "equipments".',
  '<b>much</b> + uncountable, <b>many</b> + plural: How <b>much</b> cable? How <b>many</b> panels?',
  '<b>some</b> in positive sentences; <b>any</b> in questions and negatives: We have some spare fuses. Do you have any questions?',
  '<b>a lot of</b> works with both: a lot of panels, a lot of work.'
 ],
 ex:[['please send informations','Please send the information.'],['we need more equipments','We need more equipment.'],['how much panels','How many panels?']],
 q:[
  {q:'Please send me the ___.',o:['informations','information','an information'],a:1,why:'information is uncountable.'},
  {q:'How ___ panels fit on the roof?',o:['much','many','lot'],a:1,why:'panels → many.'},
  {q:'How ___ cable do we need?',o:['much','many','few'],a:0,why:'cable (length) → much.'},
  {q:'Do you have ___ questions?',o:['some','any','much'],a:1,why:'Questions usually take any.'},
  {q:'We bought new ___.',o:['equipments','equipment','an equipment'],a:1,why:'equipment is uncountable.'},
  {q:'Plural of "battery":',o:['batterys','batteries','batteryes'],a:1,why:'consonant + y → -ies.'}
 ],
 f:[
  {w:'please send informations',a:['Please send the information.','Please send me the information.','Please send information.'],h:'No -s on information.'},
  {w:'how much panels we need',a:['How many panels do we need?'],h:'many + plural, and do for the question.'}
 ]},
{id:'pron',lv:3,band:'A1',icon:'🟢',title:'Pronouns and possessives',
 intro:'Words like I / me / my / mine, and the \'s ending, show who does something and who owns something.',
 si:'"The client he wants" වගේ subject එක දෙපාරක් කියන්න එපා.',
 rules:[
  'Subject: <b>I, you, he, she, it, we, they</b>. Object: <b>me, you, him, her, it, us, them</b>: Please call <b>me</b>. Send <b>them</b> the file.',
  'Before a noun: <b>my, your, his, her, its, our, their</b>. Alone: <b>mine, yours, his, hers, ours, theirs</b>: This is <b>my</b> laptop. It\'s <b>mine</b>.',
  '<b>\'s</b> for a person\'s thing: the client<b>\'s</b> roof, the manager<b>\'s</b> email. Plural: the designers<b>\'</b> room.',
  '<b>its</b> = belongs to it; <b>it\'s</b> = it is: the inverter and <b>its</b> cable · <b>It\'s</b> ready.',
  'Don\'t repeat the subject: "The client he wants…" ✗ → "The client wants…" ✓.'
 ],
 ex:[['please send me as zip','Please send it to me as a zip file.'],['the client he want two inverters','The client wants two inverters.'],['this is client roof','This is the client\'s roof.']],
 q:[
  {q:'Please send ___ the drawing.',o:['I','me','my'],a:1,why:'Object → me.'},
  {q:'This laptop is ___.',o:['my','mine','me'],a:1,why:'Alone (no noun after) → mine.'},
  {q:'The inverter and ___ cables are new.',o:['it\'s','its','it'],a:1,why:'Belongs to it → its.'},
  {q:'We checked the ___ bills.',o:['client','clients','client\'s'],a:2,why:'The bills belong to the client → client\'s.'},
  {q:'Which is correct?',o:['The client he wants a battery.','The client wants a battery.','The client want a battery.'],a:1,why:'One subject, and -s for he/she/it.'},
  {q:'___ office is in Colombo.',o:['Our','Us','Ours'],a:0,why:'Before a noun → our.'}
 ],
 f:[
  {w:'the client he want two inverters',a:['The client wants two inverters.'],h:'Remove "he" and add -s.'},
  {w:'this is client roof',a:['This is the client\'s roof.'],h:'the + client\'s'}
 ]},
{id:'adj',lv:3,band:'A2',icon:'🔵',title:'Adjectives and adverbs',
 intro:'Adjectives describe things (a quick reply). Adverbs describe actions (reply quickly).',
 si:'දෙයක් විස්තර කරන්න adjective (quick). ක්‍රියාවක් විස්තර කරන්න adverb (quickly).',
 rules:[
  'Adjectives describe nouns: a <b>quick</b> reply, a <b>careful</b> installer.',
  'Adverbs describe verbs, usually adjective + <b>-ly</b>: reply <b>quickly</b>, install <b>carefully</b>.',
  'Irregular: good → <b>well</b>; fast → <b>fast</b>; hard → <b>hard</b>; late → <b>late</b>. ("hardly" means "almost not".)',
  'After be / look / seem / feel / sound → adjective: The design looks <b>good</b>.',
  'Order: opinion → size → age → colour → material → noun: a <b>nice new black aluminium</b> frame (usually use only one or two).'
 ],
 ex:[['please reply quick','Please reply quickly.'],['the team worked very good','The team worked very well.']],
 q:[
  {q:'Please drive ___ on site.',o:['careful','carefully','care'],a:1,why:'Describes "drive" → adverb.'},
  {q:'The team worked very ___.',o:['good','well','goodly'],a:1,why:'good → well (adverb).'},
  {q:'The new layout looks ___.',o:['good','well','goodly'],a:0,why:'After "looks" → adjective.'},
  {q:'He replied ___.',o:['quick','quickly','more quick'],a:1,why:'Describes "replied" → adverb.'},
  {q:'It was a ___ installation.',o:['difficult','difficultly','difficulty'],a:0,why:'Describes the noun → adjective.'},
  {q:'Which is correct?',o:['She works hardly.','She works hard.','She hard works.'],a:1,why:'hard is already the adverb.'}
 ],
 f:[
  {w:'please reply quick',a:['Please reply quickly.'],h:'Adverb for the verb.'},
  {w:'the team worked very good',a:['The team worked very well.'],h:'good → well'}
 ]},
{id:'comp',lv:3,band:'A2',icon:'🔵',title:'Comparing: bigger, the biggest, as … as',
 intro:'Use comparatives to compare two things and superlatives for the top one in a group.',
 si:'"more better" කියන්නේ නැහැ — better විතරක්. සසඳන විට "than" (then නොවේ).',
 rules:[
  'Short adjectives: <b>-er / -est</b>: cheap → cheap<b>er</b> → the cheap<b>est</b>; big → big<b>ger</b>; easy → eas<b>ier</b>.',
  'Long adjectives: <b>more / the most</b>: more efficient, the most reliable.',
  'Irregular: good → <b>better</b> → the <b>best</b> · bad → <b>worse</b> → the <b>worst</b> · far → <b>further</b>.',
  'Use <b>than</b>: Model A is cheaper <b>than</b> model B. Never "more cheaper".',
  'Equal: <b>as … as</b>: This cable is <b>as thick as</b> that one. Not equal: <b>not as … as</b>.'
 ],
 ex:[['this is more better option','This is a better option.'],['model A is cheaper then model B','Model A is cheaper than model B.']],
 q:[
  {q:'Model A is ___ than model B.',o:['cheap','cheaper','more cheaper'],a:1,why:'Short adjective + -er.'},
  {q:'This is the ___ inverter we sell.',o:['most reliable','more reliable','reliablest'],a:0,why:'Long adjective → the most.'},
  {q:'The second option is ___.',o:['more better','better','gooder'],a:1,why:'good → better.'},
  {q:'This roof is ___ than the last one.',o:['biger','bigger','more big'],a:1,why:'big → bigger (double g).'},
  {q:'The new cable is as thick ___ the old one.',o:['than','as','like'],a:1,why:'as … as'},
  {q:'That was the ___ result this year.',o:['worse','worst','baddest'],a:1,why:'bad → worse → the worst.'}
 ],
 f:[
  {w:'this is more better option',a:['This is a better option.','This is the better option.'],h:'better already means "more good".'},
  {w:'model A is more cheaper then model B',a:['Model A is cheaper than model B.'],h:'cheaper + than'}
 ]},
{id:'ptime',lv:3,band:'A2',icon:'🔵',title:'in, on, at (time and place)',
 intro:'Three small words with clear rules for time and place.',
 si:'වෙලාවට at, දිනයට on, මාසය/අවුරුද්දට in. tomorrow, next week ට කිසිවක් එපා.',
 rules:[
  '<b>at</b> + clock times and exact points: at 9 a.m., at noon, at night.',
  '<b>on</b> + days and dates: on Monday, on 15 November.',
  '<b>in</b> + months, years, parts of the day, periods: in November, in 2027, in the morning, in two weeks.',
  'Place: <b>at</b> a point (at the site, at the office) · <b>in</b> inside an area (in the panel, in Colombo) · <b>on</b> a surface (on the roof, on the wall).',
  'No preposition before <b>today, tomorrow, yesterday, next week, last month</b>: "on next Monday" ✗ → "next Monday" ✓.'
 ],
 ex:[['we will visit on next monday','We will visit next Monday.'],['meeting is in 10am','The meeting is at 10 a.m.']],
 q:[
  {q:'The meeting is ___ 10 a.m.',o:['in','on','at'],a:2,why:'Clock time → at.'},
  {q:'We start ___ Monday.',o:['in','on','at'],a:1,why:'Day → on.'},
  {q:'The project ends ___ December.',o:['in','on','at'],a:0,why:'Month → in.'},
  {q:'The inverter is mounted ___ the wall.',o:['on','in','at'],a:0,why:'Surface → on.'},
  {q:'We will visit ___ next week.',o:['on','in','(nothing)'],a:2,why:'No preposition before "next".'},
  {q:'I\'m ___ the site now.',o:['at','on','in'],a:0,why:'A point/place → at.'}
 ],
 f:[
  {w:'we will visit on next monday',a:['We will visit next Monday.'],h:'Remove "on"; Monday has a capital.'},
  {w:'meeting is in 10am',a:['The meeting is at 10 a.m.','The meeting is at 10am.','The meeting is at 10 am.'],h:'Clock time → at.'}
 ]},
{id:'quest',lv:3,band:'A2',icon:'🔵',title:'Asking questions',
 intro:'English questions need a helper verb (do, does, did, is, can, will…) before the subject.',
 si:'ප්‍රශ්නයක helper verb එක subject එකට කලින්: When WILL the panels arrive?',
 rules:[
  'Yes/no questions: helper verb first: <b>Is</b> it ready? <b>Do</b> you need help? <b>Can</b> you come?',
  'Wh- questions: question word + helper + subject + verb: <b>When will</b> the panels <b>arrive</b>?',
  'Present: <b>do / does</b>; past: <b>did</b> + base verb: <b>What did</b> the client <b>say</b>?',
  'When the question word is the subject, no do/did: <b>Who sent</b> this? <b>What happened</b>?',
  '<b>How much</b> (price / uncountable), <b>How many</b>, <b>How long</b> (time), <b>Which</b> (choice), <b>Whose</b> (owner).',
  'Question tags: It\'s ready, <b>isn\'t it</b>? You sent it, <b>didn\'t you</b>?'
 ],
 ex:[['What is the best bank they offering platinum cards','Which banks offer platinum cards?'],['when panels will arrive?','When will the panels arrive?'],['what client said?','What did the client say?']],
 q:[
  {q:'___ the panels arrive?',o:['When will','When','When they will'],a:0,why:'Question word + will + subject.'},
  {q:'What ___ the client say yesterday?',o:['did','does','was'],a:0,why:'Past → did + base verb.'},
  {q:'___ sent this email?',o:['Who','Who did','Whom did'],a:0,why:'"Who" is the subject → no did.'},
  {q:'___ does the inverter cost?',o:['How many','How much','How long'],a:1,why:'Price → How much.'},
  {q:'It\'s ready, ___?',o:['is it','isn\'t it','doesn\'t it'],a:1,why:'Positive sentence → negative tag.'},
  {q:'Where ___ you work?',o:['are','do','does'],a:1,why:'you → do.'}
 ],
 f:[
  {w:'when panels will arrive',a:['When will the panels arrive?'],h:'will before the subject, and "?"'},
  {w:'what client said',a:['What did the client say?'],h:'did + base verb'}
 ]},
{id:'pcont',lv:3,band:'B1',icon:'🟡',title:'Past continuous and used to',
 intro:'Describe what was happening at a past moment, and habits that are no longer true.',
 si:'අතීතයේ යම් මොහොතක සිදුවෙමින් තිබූ → was / were + -ing. දැන් නැති පුරුද්දක් → used to.',
 rules:[
  'Past continuous = in progress at a past moment: <b>was / were + -ing</b>: At 10 a.m. we <b>were installing</b> the rails.',
  'A long action interrupted by a short one: I <b>was checking</b> the meter <b>when</b> the power <b>went</b> off.',
  '<b>while</b> + continuous: <b>While</b> we <b>were working</b>, it started to rain.',
  '<b>used to + verb</b> = a past habit that has stopped: We <b>used to</b> draw everything by hand.',
  'Negative / question: didn\'t <b>use</b> to · Did you <b>use</b> to…? (no "d")'
 ],
 ex:[['when i check the meter power was gone','When I was checking the meter, the power went off.'],['before we use to draw by hand','We used to draw everything by hand.']],
 q:[
  {q:'At 3 p.m. yesterday we ___ the panels.',o:['cleaned','were cleaning','are cleaning'],a:1,why:'In progress at a past moment.'},
  {q:'I was testing the cable when the alarm ___.',o:['went off','was going off','goes off'],a:0,why:'The short action → past simple.'},
  {q:'___ we were working, it started to rain.',o:['While','During','When while'],a:0,why:'While + continuous.'},
  {q:'We ___ use paper forms. Now we use the app.',o:['used to','use to','were used'],a:0,why:'Past habit → used to.'},
  {q:'Did you ___ live in Kandy?',o:['used to','use to','using to'],a:1,why:'After did → use to.'}
 ],
 f:[
  {w:'when i check the meter the power went off',a:['When I was checking the meter, the power went off.','I was checking the meter when the power went off.'],h:'The long action → was checking.'},
  {w:'before we use to draw by hand',a:['We used to draw by hand before.','Before, we used to draw by hand.','We used to draw everything by hand.','We used to draw by hand.'],h:'used to (with d)'}
 ]},
{id:'ppc',lv:3,band:'B1',icon:'🟡',title:'Present perfect continuous (have been doing)',
 intro:'For activities that started in the past and are still going on, or have just stopped.',
 si:'අතීතයේ පටන් අරන් තවමත් කරගෙන යන දෙයක් → have been + -ing (I have been working since 9).',
 rules:[
  '<b>have / has been + -ing</b>: I <b>have been working</b> on this SLD all day.',
  'Started in the past, still going (or just stopped): It <b>has been raining</b> since morning.',
  'Often with <b>for / since</b> and <b>How long…?</b>: How long <b>have</b> you <b>been waiting</b>?',
  'Simple = result / how many: I have <b>drawn</b> three layouts. Continuous = activity / how long: I have <b>been drawing</b> layouts for three hours.',
  'Not with state verbs (know, need, own, believe): I <b>have known</b> him for years.'
 ],
 ex:[['i am working here since 2022','I have been working here since 2022.'],['we are waiting from morning','We have been waiting since this morning.']],
 q:[
  {q:'I ___ on this drawing since 9 a.m.',o:['am working','have been working','work'],a:1,why:'Started in the past, still going.'},
  {q:'How long ___ for the panels?',o:['are you waiting','have you been waiting','do you wait'],a:1,why:'How long + have been + -ing.'},
  {q:'I have ___ three layouts today.',o:['been drawing','drawn','draw'],a:1,why:'A number of results → present perfect simple.'},
  {q:'I have ___ him for ten years.',o:['known','been knowing','know'],a:0,why:'"know" is a state verb.'},
  {q:'It has been raining ___ two hours.',o:['since','for','from'],a:1,why:'A length of time → for.'}
 ],
 f:[
  {w:'i am working here since 2022',a:['I have been working here since 2022.','I\'ve been working here since 2022.','I have worked here since 2022.'],h:'have been + -ing'},
  {w:'we are waiting from morning',a:['We have been waiting since the morning.','We have been waiting since this morning.','We\'ve been waiting since this morning.','We have been waiting since morning.'],h:'have been waiting + since'}
 ]},
{id:'gerinf',lv:3,band:'B1',icon:'🟡',title:'Verb + -ing or verb + to',
 intro:'Some verbs are followed by "to + verb", others by "-ing". After prepositions, always use -ing.',
 si:'look forward to hearing (hear නොවේ). preposition එකකට පසු -ing.',
 rules:[
  'Verb + <b>to</b> + verb: want, need, plan, decide, hope, agree, promise, manage, offer, refuse: We decided <b>to use</b> two inverters.',
  'Verb + <b>-ing</b>: enjoy, finish, avoid, suggest, recommend, consider, mind, keep, delay: I suggest <b>visiting</b> the site first.',
  'After prepositions → <b>-ing</b>: Thank you <b>for sending</b> it. Before <b>starting</b>, isolate the DC side.',
  '<b>look forward to + -ing</b>: I look forward to <b>hearing</b> from you.',
  'Meaning changes: <b>stop to do</b> (stop in order to do) / <b>stop doing</b> (no longer do) · <b>remember to send</b> (don\'t forget) / <b>remember sending</b> (memory of the past).'
 ],
 ex:[['i look forward to hear from you','I look forward to hearing from you.'],['i suggest to visit site first','I suggest visiting the site first.'],['thank you for send the bills','Thank you for sending the bills.']],
 q:[
  {q:'We decided ___ two inverters.',o:['using','to use','use'],a:1,why:'decide + to'},
  {q:'I suggest ___ the site first.',o:['to visit','visiting','visit'],a:1,why:'suggest + -ing'},
  {q:'I look forward to ___ from you.',o:['hear','hearing','heard'],a:1,why:'look forward to + -ing'},
  {q:'Thank you for ___ the bills.',o:['send','sending','to send'],a:1,why:'After "for" → -ing.'},
  {q:'Please remember ___ the main switch off.',o:['turning','to turn','turn'],a:1,why:'Don\'t forget → remember to.'},
  {q:'Avoid ___ on the roof when it rains.',o:['to work','working','work'],a:1,why:'avoid + -ing'}
 ],
 f:[
  {w:'i look forward to hear from you',a:['I look forward to hearing from you.'],h:'to + -ing here.'},
  {w:'i suggest to visit site first',a:['I suggest visiting the site first.','I suggest that we visit the site first.','I suggest we visit the site first.'],h:'suggest + -ing'}
 ]},
{id:'rel',lv:3,band:'B1',icon:'🟡',title:'Relative clauses (who, which, that, where, whose)',
 intro:'Join two ideas about the same person or thing into one sentence.',
 si:'මිනිසුන්ට who, දේවල්ට which / that, ස්ථානවලට where, අයිතියට whose.',
 rules:[
  '<b>who</b> for people, <b>which</b> for things, <b>that</b> for both: The engineer <b>who</b> designed it… · The inverter <b>that</b> failed…',
  '<b>where</b> for places, <b>whose</b> for possession: the site <b>where</b> we worked · the client <b>whose</b> roof leaks.',
  'No commas = it tells you WHICH one: The panels <b>that</b> arrived late are in the store.',
  'With commas = extra information; use who / which, never "that": The report, <b>which</b> I sent yesterday, has all the data.',
  'Don\'t repeat the object: "The cable which we bought it" ✗ → "The cable which we bought" ✓.'
 ],
 ex:[['the client he roof is leaking','the client whose roof is leaking'],['the cable which we bought it is short','The cable which we bought is too short.']],
 q:[
  {q:'The engineer ___ designed the SLD is on leave.',o:['which','who','whose'],a:1,why:'A person → who.'},
  {q:'The inverter ___ failed has been replaced.',o:['who','that','where'],a:1,why:'A thing → that / which.'},
  {q:'This is the site ___ we installed 500 panels.',o:['which','where','who'],a:1,why:'A place → where.'},

slight|adj|small|සුළු|There was a slight fall in 2012.|slightly (adv)
marginal|adj|very small|ඉතා සුළු|The change was marginal.|marginally (adv)
dramatic|adj|very large and sudden|විශාල හා හදිසි|There was a dramatic increase in solar power.|dramatically (adv)
moderate|adj|neither very large nor very small|මධ්‍යස්ථ|Wind power saw moderate growth.|moderately (adv)
roughly|adv|approximately|දළ වශයෙන්|Roughly half of the students passed.|
just under|phr|a little less than|ටිකක් අඩුවෙන්|Just under 30% of households had internet access.|
well over|phr|much more than|බොහෝ වැඩියෙන්|Well over half of the workers drove to work.|
nearly|adv|almost|ආසන්න වශයෙන්|Nearly a third of energy came from coal.|
the majority|n|more than half|බහුතරය|The majority of people travelled by car.|
a minority|n|less than half; a small group|සුළුතරයක්|Only a minority of workers cycled.|
a quarter|n|25%|හතරෙන් එකක්|A quarter of the budget was spent on heating.|
double|v|to become twice as large|දෙගුණ වෙනවා|The number of cyclists is expected to double.|double (adj)
threefold|adj|three times as much|තෙගුණ|There was a threefold increase in train use.|
account for|v|to form a part of a total|... ක් වෙනවා / දායක වෙනවා|Appliances account for a third of energy use.|
overview|n|a short summary of the main features|සාරාංශය|Every Task 1 report needs a clear overview.|
the former|n|the first of two things mentioned|පළමුවැන්න|Of coal and solar, the former declined.|
the latter|n|the second of two things mentioned|දෙවැන්න|Of coal and solar, the latter grew fastest.|
by contrast|phr|used to show a clear difference|ඊට වෙනස්ව|Coal fell. By contrast, solar rose sharply.|
in comparison|phr|when compared|සසඳන විට|In comparison, wind power grew slowly.|
rank|v|to have a position in a list|ස්ථානගත වෙනවා|Country A is likely to rank first in internet access.|
outnumber|v|to be more in number than|ගණනින් වැඩි වෙනවා|Women outnumber men in the teaching profession.|
overtake|v|to become greater than something else|ඉක්මවා යනවා|Solar is expected to overtake coal by 2030.|
stand at|v|to be at a particular level|... මට්ටමේ පවතිනවා|The figure is expected to stand at 40% in 2030.|`;

/* Build the IELTS vocabulary topics (words already taught elsewhere are linked, not duplicated) */
(function(){
 const wid=w=>'w-'+w.toLowerCase().replace(/[^a-z0-9]+/g,'-');
 const have=new Set();VOCAB.forEach(t=>t.words.forEach(a=>have.add(wid(a[0]))));
 const mk=(id,icon,title,group,raw)=>{const t={id,icon,title,ielts:true,group,words:[],refs:[]};
  raw.trim().split('\n').forEach(line=>{const p=line.split('|').map(s=>s.trim());if(!p[0])return;const k=wid(p[0]);
   if(have.has(k)){t.refs.push(k);return;}
   if(p.length<5){try{console.warn('IELTS word without data:',p[0]);}catch(e){}return;}
   have.add(k);t.words.push([p[0],p[2],p[3],p[4],p[1],p[5]||'']);});
  VOCAB.push(t);};
 IELTS_AWL_RAW.forEach((raw,i)=>mk('awl'+(i+1),'🎓','Academic Word List · Sublist '+(i+1),'awl',raw));
 mk('it1lang','📈','Task 1: describing charts','t1',IELTS_T1_RAW);
 IELTS_TOPIC_RAW.forEach(([id,icon,title,raw])=>mk(id,icon,title,'topic',raw));
 (typeof IELTS_MORE!=='undefined'?IELTS_MORE:[]).forEach(([id,icon,title,group,raw])=>mk(id,icon,title,group,raw));
})();

{id:'overview',icon:'🧭',title:'The IELTS test and band 7.5',sub:'Format, scoring and what 7.5 really means',html:`
<h3>Academic or General Training?</h3>
<p><b>Academic</b> is for university study and many professional registrations. <b>General Training</b> is usually for work and migration. <b>Listening and Speaking are the same</b> in both; Reading and Writing are different. Always check which version your university, employer or visa needs.</p>
<h3>The four parts</h3>
<table class="itable"><tr><th>Part</th><th>Time</th><th>What you do</th></tr>
<tr><td>🎧 Listening</td><td>about 30 min</td><td>4 recordings, 40 questions. You hear each recording <b>once</b>. On paper you get 10 extra minutes to transfer answers; on computer, 2 minutes to check.</td></tr>
<tr><td>📖 Reading</td><td>60 min</td><td>3 sections, 40 questions. No extra transfer time.</td></tr>
<tr><td>✍️ Writing</td><td>60 min</td><td>Task 1 (at least 150 words, about 20 min) and Task 2 (at least 250 words, about 40 min). <b>Task 2 is worth twice as much as Task 1.</b></td></tr>
<tr><td>🗣️ Speaking</td><td>11–14 min</td><td>3 parts with an examiner, face to face or by video call. It can be on the same day or up to 7 days before or after the other parts.</td></tr></table>
<p class="small muted">Listening, Reading and Writing are taken one after another with no breaks. The whole test, including Speaking, takes about 2 hours 45 minutes.</p>
<h3>How the score is calculated</h3>
<ul><li>Each skill gets a band from 0 to 9, in whole or half bands.</li>
<li>Listening and Reading: 1 mark per correct answer, out of 40, then converted to a band.</li>
<li>Writing and Speaking: an examiner gives a band for 4 criteria (25% each).</li>
<li><b>Overall band</b> = the average of the four skills, rounded to the nearest half band. An average ending in <b>.25</b> or <b>.75</b> is rounded <b>up</b>. Example: 7.5 + 7.0 + 7.0 + 7.5 = 29 ÷ 4 = 7.25 → <b>7.5</b>. But 7.0 + 7.0 + 7.0 + 7.5 = 28.5 ÷ 4 = 7.125 → <b>7.0</b>.</li></ul>
<h3>What band 7.5 needs</h3>
<table class="itable"><tr><th>Skill</th><th>Roughly</th></tr>
<tr><td>Listening</td><td>about 32–34 of 40 correct</td></tr>
<tr><td>Academic Reading</td><td>about 33–34 of 40</td></tr>
<tr><td>General Training Reading</td><td>about 36 of 40 (35 ≈ band 7)</td></tr>
<tr><td>Writing / Speaking</td><td>mostly band 7 features, with some band 8 features</td></tr></table>
<p class="small muted">The exact number of marks changes slightly from test to test. These are averages, not guarantees.</p>
<h3>Band 7 and band 8 in plain words (Writing & Speaking)</h3>
<p><b>Band 7:</b> you answer every part of the question with a clear position and well-developed ideas; your ideas are logically organised and linked with a range of linking words; you use some less common words and correct collocations; you use a variety of complex sentences, and many of your sentences have no errors. In speaking, you can talk at length without obvious effort, with only some hesitation.</p>
<p><b>Band 8:</b> ideas are fully developed and relevant; paragraphing and linking feel natural; you use a wide range of vocabulary fluently and precisely, with rare mistakes; most sentences are error-free. In speaking, you are fluent and hesitate only to think about content, and you are easy to understand throughout.</p>
<p>So for <b>7.5</b>: be clear, organised and accurate first; then add precise, less common vocabulary and varied structures.</p>`},
{id:'task2',icon:'📝',title:'Writing Task 2: the essay',sub:'5 question types, a 4-paragraph plan and phrases',html:`
<h3>The task</h3>
<p>Write <b>at least 250 words</b> in about <b>40 minutes</b> on a general topic. Task 2 gives two-thirds of your Writing score. It is marked on 4 criteria, 25% each: <b>Task Response</b> (answering the question fully), <b>Coherence & Cohesion</b> (organisation and linking), <b>Lexical Resource</b> (vocabulary) and <b>Grammatical Range & Accuracy</b>.</p>
<h3>The 5 question types</h3>
<table class="itable"><tr><th>Type</th><th>Key words</th><th>What to do</th></tr>
<tr><td>Opinion</td><td>To what extent do you agree or disagree?</td><td>Give a clear position in the introduction and keep it in every paragraph.</td></tr>
<tr><td>Discussion</td><td>Discuss both views and give your opinion.</td><td>One paragraph for each view, then make your own opinion clear.</td></tr>
<tr><td>Advantages / disadvantages</td><td>Do the advantages outweigh the disadvantages?</td><td>Discuss both sides and say which is stronger.</td></tr>
<tr><td>Problem / solution</td><td>What are the causes? What can be done?</td><td>One paragraph of causes (or effects), one paragraph of matching solutions.</td></tr>
<tr><td>Two-part question</td><td>Why is this? Is it positive or negative?</td><td>Answer <b>both</b> questions, one paragraph each.</td></tr></table>
<h3>A clear 4-paragraph plan</h3>
<ol><li><b>Introduction (2 sentences):</b> paraphrase the topic + your position or what the essay will do.</li>
<li><b>Body paragraph 1:</b> topic sentence → explanation → specific example → link back.</li>
<li><b>Body paragraph 2:</b> the same pattern for your second main idea (or the other view).</li>
<li><b>Conclusion (1–2 sentences):</b> restate your position and summarise the main reasons. No new ideas.</li></ol>
<p>Timing: <b>5 min</b> planning → <b>30 min</b> writing → <b>5 min</b> checking.</p>
<h3>Useful phrases</h3>
<ul><li><b>Position:</b> I firmly believe that… · This essay will argue that… · I largely agree that…</li>
<li><b>Adding:</b> Furthermore, … · In addition, … · Moreover, …</li>
<li><b>Contrast / concession:</b> On the other hand, … · Admittedly, …, but … · Although …, …</li>
<li><b>Examples:</b> For instance, … · A case in point is … · This is particularly true of …</li>
<li><b>Result:</b> As a result, … · Consequently, … · This means that …</li>
<li><b>Conclusion:</b> In conclusion, … · To sum up, …</li></ul>
<h3>Band 7+ checklist</h3>
<ul><li>Answer <b>every part</b> of the question.</li><li>One main idea per paragraph, explained and supported with a specific example.</li><li>Formal style: no contractions (don't → do not), no "a lot of", "kids", "stuff".</li><li>Mix simple and complex sentences: although…, which…, if…, not only… but also…</li><li>Check <b>a / an / the</b> and plural -s — your two most common mistakes.</li><li>Do not memorise whole paragraphs: examiners recognise them.</li></ul>`},
{id:'task1a',icon:'📊',title:'Writing Task 1 (Academic): charts',sub:'Line, bar, pie, table, process and map',html:`
<h3>The task</h3>
<p>Describe a graph, chart, table, map or process in <b>at least 150 words</b>, in about <b>20 minutes</b>. Report the information — <b>do not give your opinion</b> or reasons that are not shown.</p>
<h3>The 4-paragraph structure</h3>
<ol><li><b>Introduction:</b> paraphrase the title (what, where, when). "The line graph illustrates how much electricity was generated…"</li>
<li><b>Overview:</b> 2 main features: the biggest trends or differences, with no numbers. "Overall, …" <b>Without an overview you cannot get band 7 for Task Achievement.</b></li>
<li><b>Details 1</b> and <b>4. Details 2:</b> group the data logically and compare, with key numbers.</li></ol>
<h3>Language of change</h3>
<table class="itable"><tr><th>Up</th><th>Down</th><th>Other</th></tr>
<tr><td>rise, increase, grow, climb, surge, soar</td><td>fall, decrease, decline, drop, plunge, plummet</td><td>fluctuate, remain stable, level off, plateau, peak, bottom out</td></tr></table>
<p><b>How much:</b> dramatically, sharply, significantly, considerably, steadily, gradually, moderately, slightly, marginally.<br>
<b>Approximately:</b> roughly, about, just under, nearly, just over, well over.<br>
<b>Proportions:</b> a quarter, a third, half, the majority, a minority, twice as many as, threefold.</p>
<h3>Two sentence patterns</h3>
<ul><li>Verb + adverb: <i>Coal output <b>fell steadily</b> to 25 TWh.</i></li>
<li>Adjective + noun: <i>There was a <b>steady fall</b> in coal output, to 25 TWh.</i></li></ul>
<h3>Tenses</h3>
<p>Past dates → past simple. Up to now → present perfect. Future dates → <i>is expected / predicted to</i>.</p>
<h3>Processes and maps</h3>
<p><b>Process:</b> use the passive and sequence words: <i>First, the tea leaves <b>are picked</b>. They <b>are then dried</b>…</i><br>
<b>Map:</b> <i>The forest <b>was cleared</b> and a car park <b>was built</b>. The school <b>was extended</b> to the north.</i></p>`},
{id:'task1g',icon:'✉️',title:'Writing Task 1 (General Training): letters',sub:'Formal, semi-formal and informal letters',html:`
<h3>The task</h3>
<p>Write a letter of <b>at least 150 words</b> in about <b>20 minutes</b>. Cover <b>all three bullet points</b> in the question and use the right tone.</p>
<h3>Choose the tone</h3>
<table class="itable"><tr><th>Tone</th><th>When</th><th>Start</th><th>Finish</th></tr>
<tr><td>Formal</td><td>a company or official you don't know</td><td>Dear Sir or Madam,</td><td>Yours faithfully,</td></tr>
<tr><td>Semi-formal</td><td>someone you know in a formal role (manager, landlord)</td><td>Dear Mr Perera,</td><td>Yours sincerely,</td></tr>
<tr><td>Informal</td><td>a friend or relative</td><td>Dear Nimal, / Hi Nimal,</td><td>Best wishes, / Take care,</td></tr></table>
<h3>Structure</h3>
<ol><li>Greeting.</li><li>Opening sentence with the purpose: <i>I am writing to…</i> (formal) / <i>It was great to hear from you!</i> (informal).</li><li>One paragraph for each bullet point.</li><li>Closing line: <i>I look forward to hearing from you.</i> / <i>Can't wait to see you!</i></li><li>Sign-off and your name.</li></ol>
<h3>Useful phrases</h3>
<ul><li><b>Request:</b> I would be grateful if you could… (formal) · Could you…? (informal)</li>
<li><b>Complaint:</b> I am writing to express my dissatisfaction with…</li>
<li><b>Apology:</b> Please accept my apologies for… · I'm so sorry about…</li>
<li><b>Suggestion:</b> I would suggest that… · Why don't we…?</li></ul>`},
{id:'reading',icon:'📖',title:'Reading: question types and strategy',sub:'True/False/Not Given, headings, completion',html:`
<h3>The test</h3>
<p><b>Academic:</b> 3 long texts from books, journals, magazines and newspapers. <b>General Training:</b> 3 sections, from everyday and workplace texts to one longer text. Both: <b>40 questions in 60 minutes</b>, and the questions get harder. There is no extra time to transfer answers.</p>
<h3>Strategy</h3>
<ul><li>Spend about <b>20 minutes per section</b>. If a question takes too long, guess and move on — there is no penalty for wrong answers.</li>
<li><b>Skim</b> the text first (title, first sentence of each paragraph) to understand the structure.</li>
<li><b>Scan</b> for names, numbers and key words to find where the answer is.</li>
<li>Answers are usually <b>paraphrased</b>: the question uses different words from the text. This is why vocabulary matters so much.</li></ul>
<h3>Question types</h3>
<table class="itable"><tr><th>Type</th><th>How to answer</th></tr>
<tr><td>True / False / Not Given</td><td><b>True</b> = the text says the same. <b>False</b> = the text says the opposite. <b>Not Given</b> = the text says nothing about it. Never use your own knowledge.</td></tr>
<tr><td>Yes / No / Not Given</td><td>The same idea, but about the <b>writer's opinions</b>.</td></tr>
<tr><td>Matching headings</td><td>Read the paragraph, summarise its main idea in your own words, then choose. Don't just match single words.</td></tr>
<tr><td>Sentence / summary completion</td><td>Check the word limit ("ONE WORD ONLY"). Copy the word exactly as it is spelled in the text. The sentence must be grammatical.</td></tr>
<tr><td>Multiple choice</td><td>Find the part of the text, then eliminate the wrong options one by one.</td></tr>
<tr><td>Matching sentence endings</td><td>Use grammar and meaning: the ending must complete the sentence correctly.</td></tr></table>`},
{id:'listening',icon:'🎧',title:'Listening: the 4 parts and strategy',sub:'Prediction, distractors and spelling',html:`
<h3>The 4 parts (40 questions, heard once)</h3>
<table class="itable"><tr><th>Part</th><th>What you hear</th></tr>
<tr><td>1</td><td>A conversation in an everyday situation, e.g. booking or enquiring.</td></tr>
<tr><td>2</td><td>One person speaking about an everyday topic, e.g. a tour or facilities.</td></tr>
<tr><td>3</td><td>A conversation in an education setting, e.g. students and a tutor.</td></tr>
<tr><td>4</td><td>An academic lecture.</td></tr></table>
<h3>Strategy</h3>
<ul><li><b>Read the questions before you listen</b> and underline the key words.</li>
<li><b>Predict</b> the type of answer: a number, a name, a place, a plural noun?</li>
<li>Watch for <b>distractors</b>: speakers often say one thing and then correct it ("Wednesday… no, that's full, Thursday").</li>
<li><b>Spelling, plurals and word limits</b> count. A misspelled answer is wrong.</li>
<li>Numbers: listen for "double" (e.g. double seven = 77) and the difference between 15 and 50.</li>
<li>In lectures, listen for signposts: "firstly", "moving on to", "the main reason is", "to sum up".</li></ul>
<h3>Daily practice</h3>
<p>Listen to 15–20 minutes of English every day: podcasts, documentaries or lectures. Once a week, write down what you hear for 2 minutes, then compare with the transcript.</p>`},
{id:'speaking',icon:'🗣️',title:'Speaking: the 3 parts',sub:'What the examiner wants and useful phrases',html:`
<h3>The 3 parts</h3>
<table class="itable"><tr><th>Part</th><th>Time</th><th>What happens</th></tr>
<tr><td>1</td><td>4–5 min</td><td>Questions about familiar topics: work, home, hobbies. Answer in 2–3 sentences: <b>answer + reason + example</b>.</td></tr>
<tr><td>2</td><td>3–4 min</td><td>A cue card. You get <b>1 minute to prepare</b> (you can make notes), then speak for <b>1–2 minutes</b>. Use the bullet points as your plan.</td></tr>
<tr><td>3</td><td>4–5 min</td><td>A discussion of more abstract ideas related to Part 2. Give your opinion, explain it, give an example and consider another view.</td></tr></table>
<h3>The 4 criteria (25% each)</h3>
<ul><li><b>Fluency & Coherence:</b> speak at length without long pauses; link your ideas.</li><li><b>Lexical Resource:</b> precise and some less common words; paraphrase when you don't know a word.</li><li><b>Grammatical Range & Accuracy:</b> a mix of tenses and complex sentences.</li><li><b>Pronunciation:</b> clear sounds, word stress and natural intonation.</li></ul>
<h3>Band 7.5 tips</h3>
<ul><li>Don't memorise answers — examiners notice, and it lowers your score.</li>
<li>Use natural spoken linking: <i>Actually, … · The thing is, … · Having said that, … · On top of that, …</i></li>
<li>If you make a mistake, correct it quickly and continue.</li>
<li>Practise your problem sounds: v / w, th, and -ed endings (see Pronunciation in Learn).</li></ul>
<h3>Useful phrases</h3>
<ul><li><b>Buying time:</b> That's an interesting question. Let me think… · I've never really thought about that, but…</li>
<li><b>Opinion:</b> Personally, I'd say… · I'm convinced that… · I tend to think…</li>
<li><b>Speculating:</b> I imagine that… · It's quite likely that… · In the future, we might see…</li>
<li><b>Past and present:</b> Back when I was at school… · These days, … · Compared with my parents' generation, …</li></ul>`},
{id:'paraphrase',icon:'🔁',title:'Paraphrasing and band 7 vocabulary',sub:'Upgrades, collocations and word forms',html:`
<h3>Why paraphrasing matters</h3>
<p>You need it in every part of IELTS: to introduce Task 1 and Task 2 without copying the question, and to recognise answers in Reading and Listening, which are almost always paraphrased.</p>
<h3>4 ways to paraphrase</h3>
<ol><li><b>Synonyms:</b> people → individuals · cause → lead to · show → illustrate.</li>
<li><b>Change the word form:</b> prices increased (v) → there was an increase in prices (n).</li>
<li><b>Change the structure:</b> The government built a bridge → A bridge was built by the government.</li>
<li><b>Change number expressions:</b> 25% → a quarter · 52% → just over half.</li></ol>
<h3>Upgrades (common → band 7+)</h3>
<table class="itable"><tr><th>Instead of</th><th>Try</th></tr>
<tr><td>a lot of</td><td>a considerable number of / a great deal of</td></tr>
<tr><td>big</td><td>substantial / significant / considerable</td></tr>
<tr><td>good / bad</td><td>beneficial / detrimental</td></tr>
<tr><td>show</td><td>demonstrate / illustrate / indicate</td></tr>
<tr><td>help</td><td>assist / facilitate / enable</td></tr>
<tr><td>important</td><td>crucial / vital / essential</td></tr>
<tr><td>problem</td><td>issue / challenge / concern</td></tr>
<tr><td>make worse / make better</td><td>exacerbate / enhance</td></tr>
<tr><td>get</td><td>obtain / acquire / become</td></tr>
<tr><td>because of</td><td>owing to / due to / as a result of</td></tr></table>
<h3>Band 7 collocations</h3>
<p>play a crucial role in · have a detrimental effect on · pose a serious threat to · raise awareness of · address the issue of · meet the demand for · bridge the gap between · take measures to · reach a consensus · draw a conclusion · make a significant contribution to · a growing concern</p>
<p class="small muted">Use a less common word only when you are sure of its meaning and collocation. A wrong "fancy" word lowers your score more than a simple correct one.</p>`},
{id:'next',icon:'🚀',title:'After the 28 days: your next steps',sub:'How to keep improving towards 7.5',html:`
<h3>Keep the habits</h3>
<ul><li><b>Every day:</b> 10 IELTS words + review (Words tab), 15–20 minutes of listening.</li>
<li><b>Every week:</b> 2 essays (Task 2) + 1 Task 1, timed, then analysed and compared with the models.</li>
<li><b>Every two weeks:</b> a full reading or listening test, and record yourself on 2 cue cards.</li></ul>
<h3>Get real feedback</h3>
<p>The analysis in this app checks structure, vocabulary range, linking and common mistakes, but it is <b>not an examiner</b>. Ask a teacher or a strong English speaker to mark some essays against the band descriptors, and practise speaking with a partner regularly.</p>
<h3>Official practice</h3>
<p>Use the free practice tests on the official IELTS websites and the Cambridge IELTS practice books (Academic or General Training, as you need). Take at least one full timed practice test before your real test.</p>

{id:'t2a',type:'Opinion',q:'Some people believe that governments should invest more in renewable energy than in fossil fuels, even if this increases electricity prices. To what extent do you agree or disagree?',
model:`Energy policy has become one of the most pressing issues facing governments today. While some argue that public money should continue to support cheaper fossil fuels, I firmly believe that prioritising renewable energy is the right choice, even if consumers pay more in the short term.

The most compelling reason is the environmental cost of coal, oil and gas. Burning these fuels releases large quantities of carbon dioxide, which is the main driver of climate change. The consequences, such as more frequent floods, droughts and heatwaves, already impose enormous costs on economies. Paying slightly higher electricity bills now is therefore a reasonable price for avoiding far greater damage later.

Furthermore, renewable energy offers long-term economic benefits. Once solar panels and wind turbines are installed, their fuel is free, whereas fossil fuel prices fluctuate with global markets. Countries that import oil, such as Sri Lanka, are particularly vulnerable to these price shocks. Investing in local renewable sources would strengthen energy security and create skilled jobs in installation and maintenance.

Admittedly, rising electricity prices could place a heavy burden on low-income households. However, this problem can be addressed through targeted measures rather than by abandoning clean energy. Governments could, for instance, offer subsidies to poorer families or introduce tariffs that charge less for the first units consumed. In addition, the cost of renewable technology has fallen dramatically over the past decade, so any price increase is likely to be temporary.

In conclusion, although higher prices are a legitimate concern, I strongly agree that governments should invest more in renewable energy than in fossil fuels. The environmental and economic advantages clearly outweigh the short-term costs, particularly if vulnerable groups are protected.`},
{id:'t2b',type:'Opinion',q:'Working from home is becoming more common. Some people say it benefits both employees and employers. To what extent do you agree or disagree?',
model:`In recent years, advances in digital technology have allowed millions of people to work from home. I largely agree that this arrangement can benefit both workers and companies, although its success depends on the type of job and how it is managed.

For employees, the most obvious advantage is the time and money saved on commuting. In congested cities, workers may spend two or three hours travelling each day, so working remotely gives them more time for rest and family life. This improved work-life balance often leads to lower stress and higher job satisfaction. Many people also find they can concentrate better at home, away from the interruptions of a busy office.

Employers can gain as well. Companies that allow remote work can reduce spending on office space and electricity, and they can recruit talented staff from a much wider area. Some studies have suggested that productivity does not fall, and may even rise, when employees are trusted to manage their own time.

Nevertheless, working from home is not suitable for everyone. Some roles, such as those in manufacturing, healthcare or site engineering, require people to be physically present. In addition, employees who work alone may feel isolated, and young workers in particular can miss the informal learning that happens when they sit next to experienced colleagues. For this reason, many organisations now prefer a hybrid model, in which staff spend part of the week in the office.

In conclusion, I believe working from home offers clear benefits to both sides, especially through saved time, lower costs and greater flexibility. However, it works best as part of a balanced arrangement rather than as a complete replacement for the workplace.`},
{id:'t2c',type:'Discussion',q:'Some people think children should start learning a foreign language at primary school, while others believe they should begin in secondary school. Discuss both views and give your own opinion.',
model:`The question of when children should begin learning a foreign language divides parents and educators. Although there are reasonable arguments for waiting until secondary school, I believe that starting at primary level is more beneficial.

Those who favour a later start argue that young children should first master their mother tongue. In their view, introducing a second language too early may confuse pupils and take time away from essential subjects such as reading and mathematics. They also point out that older students are more disciplined and can understand grammar rules, so they may make faster progress in a shorter time.

On the other hand, supporters of early learning emphasise that young children acquire languages naturally. At the age of six or seven, pupils are less afraid of making mistakes and can imitate sounds more accurately, which helps them develop good pronunciation. Starting early also gives learners many more years of exposure before they finish school, and this long period of practice is often the key to fluency. Moreover, learning another language at a young age can make children more open to other cultures.

In my opinion, the advantages of an early start outweigh the risks. Research on bilingual children generally suggests that learning two languages does not harm the first language, provided that both are well taught. The real challenge is not the age of the learners but the quality of teaching. If primary schools employ trained teachers and use games, songs and stories rather than rote learning, young children can build a strong foundation.

In conclusion, while older students may learn grammar more quickly, I believe children should begin a foreign language at primary school, as long as lessons are engaging and taught by qualified staff.`},
{id:'t2d',type:'Advantages / disadvantages',q:'More and more people are using artificial intelligence tools at work. Do the advantages of this development outweigh the disadvantages?',
model:`Artificial intelligence (AI) tools, from writing assistants to design software, are rapidly becoming part of everyday working life. In my view, the advantages of this development outweigh the disadvantages, provided that people use these tools responsibly.

The main benefit of AI is a significant increase in productivity. Tasks that once took hours, such as summarising reports, analysing data or drafting routine emails, can now be completed in minutes. This frees employees to focus on work that requires human judgement, creativity and communication. In engineering, for example, software can generate several design options quickly, allowing engineers to spend more time evaluating the best solution. AI can also reduce human error in repetitive calculations.

However, the growing use of AI raises genuine concerns. Some routine jobs, particularly in administration and customer service, may disappear, and workers whose skills become obsolete could struggle to find new employment. There are also risks related to accuracy and privacy: AI systems sometimes produce convincing but incorrect information, and employees may share confidential data without realising it. If people rely on these tools without checking the results, serious mistakes could follow.

Nevertheless, these disadvantages can largely be managed. Companies can train staff to verify AI output and set clear rules on data protection, while governments can invest in retraining programmes for workers whose roles change. History suggests that new technologies tend to transform jobs rather than simply eliminate them, and AI is likely to create new roles that do not yet exist.

In conclusion, although AI at work brings real risks to employment and accuracy, its potential to boost efficiency and support human decision-making is greater. With proper training and regulation, the benefits clearly outweigh the drawbacks.`},
{id:'t2e',type:'Problem / solution',q:'Traffic congestion is a growing problem in many cities. What are the causes of this problem, and what measures could be taken to solve it?',
model:`Traffic jams have become a daily frustration in cities around the world, from London to Colombo. This essay will examine the main causes of congestion and suggest several measures that could reduce it.

The most important cause is the rapid increase in private car ownership. As incomes rise, more families can afford vehicles, and many people prefer the comfort and convenience of driving to using crowded buses. A second cause is poor urban planning. In many cities, offices, schools and shopping centres are concentrated in one central area, so large numbers of people travel in the same direction at the same time each morning and evening. Finally, inadequate public transport leaves commuters with little choice: if trains are unreliable and buses are slow, people will continue to drive.

Several solutions could address these problems. Firstly, governments should invest in fast, frequent and affordable public transport, such as rapid bus lanes and modern rail networks. When public transport is genuinely more efficient than driving, many commuters will switch voluntarily. Secondly, authorities could introduce congestion charges, requiring drivers to pay to enter the city centre at busy times; this approach has reduced traffic in cities such as London and Singapore. Thirdly, employers can help by offering flexible working hours or the option to work from home on some days, which spreads journeys more evenly across the day.

In conclusion, congestion is mainly caused by rising car ownership, centralised planning and weak public transport. A combination of better public transport, road pricing and flexible working arrangements offers the most realistic way to make city streets move again.`},
{id:'t2f',type:'Two-part question',q:'Many young people today want to work abroad. Why is this? Is this a positive or negative development?',
model:`It is increasingly common for young graduates to seek employment in other countries. This essay will explain why this trend is growing and argue that, overall, it is a positive development, although it creates some challenges for the countries they leave behind.

In my view, this trend is largely beneficial. On an individual level, working abroad helps young people develop valuable skills, international contacts and confidence. Their home countries can also gain, because money sent home is an important source of foreign currency, and many migrants eventually return with knowledge and savings that can be used to start businesses. Furthermore, professionals who remain abroad often maintain links with their home country, encouraging trade and investment.

That said, the movement of skilled workers can cause a "brain drain". When large numbers of doctors, nurses and engineers leave, public services at home may suffer. To reduce this risk, governments could improve working conditions and offer incentives for professionals to return after gaining experience overseas.

In conclusion, young people work abroad mainly for higher income, better career opportunities and personal growth. Although the loss of skilled workers is a real concern, I believe the benefits to individuals and to their home countries make this a positive development overall.`},

{id:'p2',title:'Why Cities Are Hotter',minutes:20,lettered:true,paras:[
`On a hot summer evening, the centre of a large city can be several degrees warmer than the farmland just outside it. This difference is known as the urban heat island effect. It is not a new discovery: as early as the 1810s, the English amateur meteorologist Luke Howard recorded that central London was frequently warmer than the surrounding countryside, especially at night. What has changed is the scale of the problem. With more than half of the world's population now living in towns and cities, and heatwaves becoming more frequent, understanding why cities trap heat has become a matter of public health.`,
`The first explanation lies in the materials from which cities are built. Asphalt roads, dark roofs and concrete pavements absorb a large proportion of the sunlight that falls on them, whereas grass and trees reflect more of it. Moreover, materials such as concrete and brick are very good at storing heat. During the day they slowly warm up, and after sunset they release this stored energy into the air. This is why the temperature difference between a city and the countryside is often greatest several hours after dark rather than in the middle of the afternoon.`,
`A second factor is the absence of vegetation. Plants act as natural air conditioners: they draw water from the soil and release it through their leaves, and the evaporation of this water uses energy, which cools the surrounding air. In a typical city, however, much of the ground is covered with hard surfaces. When it rains, water runs quickly into drains instead of soaking into the soil, so there is little moisture available for evaporation on the following days. Parks, by contrast, are often noticeably cooler than the streets around them.`,
`The shape of the city also matters. Where tall buildings line narrow streets, they form what researchers call urban canyons. Sunlight is reflected back and forth between the walls, and the buildings block the wind that would otherwise carry warm air away. On top of this, cities generate their own heat. Vehicles, factories and, increasingly, air conditioning units all release waste heat into the streets. This creates a vicious circle: as the city becomes hotter, more people switch on air conditioners, which in turn pump more heat outside.`,
`The consequences can be serious. During heatwaves, hospitals see a rise in heat-related illness, and elderly people and those with heart conditions are particularly at risk. High night-time temperatures are especially dangerous because they prevent the human body from recovering after a hot day. Higher temperatures also increase the demand for electricity, which can place a strain on power grids at the very moment when they are most needed. In addition, heat speeds up the chemical reactions that produce ground-level ozone, a pollutant that can damage the lungs.`,
`Fortunately, there are many ways to reduce urban heat. One of the simplest is to paint roofs with reflective materials, so that they absorb less sunlight; such cool roofs can lower the temperature inside the building as well as outside. Green roofs, which are covered with plants, provide similar benefits and also absorb rainwater. Planting trees along streets offers shade and cooling, while new parks and water features can create cooler zones within a neighbourhood. In the long term, planners can design streets that allow the wind to flow through. No single measure is enough on its own, but experience in many cities suggests that combining several of them can make a measurable difference.`],
